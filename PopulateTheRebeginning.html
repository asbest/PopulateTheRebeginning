        const mat = new THREE.MeshBasicMaterial({color: 0x113311, transparent: true, opacity: 0.6});
        this.mesh = new THREE.Mesh(geo, mat);
        this.mesh.position.copy(this.pos);
        state.scene.add(this.mesh);
        SoundManager.playSound('magic');
    }
    update(dt) {
        this.timer -= dt;

        // Visual pulse
        this.mesh.scale.setScalar(1.0 + Math.sin(this.timer * 2) * 0.05);
        this.mesh.material.opacity = 0.6 + Math.sin(this.timer * 3) * 0.2;

        // Bubbles
        if(Math.random() < 0.1) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * this.radius * 0.8;
            const bubbleMesh = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({color: 0x224422, transparent: true, opacity: 0.8}));
            bubbleMesh.position.set(this.pos.x + Math.cos(angle)*r, this.pos.y, this.pos.z + Math.sin(angle)*r);

            state.particles.push(new VisualEffect(bubbleMesh, 0.5 + Math.random()*0.5, (eff, dt) => {
                eff.mesh.position.y += dt;
                eff.mesh.scale.setScalar(1.0 + (1.0 - (eff.life/eff.maxLife)) * 1.5);
                eff.mesh.material.opacity = eff.life / eff.maxLife;
            }));
        }

        // Kill units
        SpatialHash.query(this.pos.x, this.pos.z, this.radius * 0.8).forEach(u => {
            if(u.state !== 'dead' && !u.isShaman && u.faction !== this.faction) {
                const dist = Math.sqrt((u.mesh.position.x - this.pos.x)**2 + (u.mesh.position.z - this.pos.z)**2);
                if(dist < this.radius * 0.8) {
                 u.takeDamage(10000); // Instant death
                     spawnPulse(u.mesh.position.x, u.mesh.position.y, u.mesh.position.z, 0x000000);
                }
            }
        });

        if(this.timer <= 0) {
            state.scene.remove(this.mesh);
            this.mesh.geometry.dispose();
            this.mesh.material.dispose();
            return false;
        }
        return true;
    }
}

class Tornado extends ActiveEffect {
    constructor(x, z, faction) {
        super();
        this.pos = new THREE.Vector3(x, getHeight(x,z), z);
        this.faction = faction;
        this.timer = 20.0;
        this.moveDelay = 5.0;
        this.angle = Math.random() * Math.PI * 2;
        this.mesh = new THREE.Group();

        // Use overlapping clouds for funnel
        const cloudMat = new THREE.MeshBasicMaterial({color: 0x999999, transparent: true, opacity: 0.6});
        for(let i=0; i<7; i++) {
            const p = new THREE.Mesh(AssetCache.geos.cloud, cloudMat);
            const scale = 1.0 + (i * 0.4);
            p.scale.set(scale, scale*0.5, scale);
            p.position.set(0, i * 1.5, 0);
            p.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            p.userData = { rotSpeed: (15 - i)*0.5 + 2.0 };
            this.mesh.add(p);
        }
        state.scene.add(this.mesh);
        SoundManager.playSound('rumble');
    }
    update(dt) {
        this.timer -= dt;

        if (this.moveDelay > 0) {
            this.moveDelay -= dt;
        } else {
            // Move Randomly
            this.angle += (Math.random()-0.5) * 2 * dt;
            const speed = 8;
            this.pos.x += Math.cos(this.angle) * speed * dt;
            this.pos.z += Math.sin(this.angle) * speed * dt;
        }
        this.pos.y = getHeight(this.pos.x, this.pos.z);

        this.mesh.position.copy(this.pos);

        // Animate Visuals
        this.mesh.rotation.y += dt * 5.0; // Rotate whole group
        this.mesh.children.forEach(c => {
             c.rotation.y += c.userData.rotSpeed * dt;
             c.rotation.z += dt;
        });

        // Physics
        const damagePerSecond = 300;
        SpatialHash.query(this.pos.x, this.pos.z, 5).forEach(u => {
            const d = u.mesh.position.distanceTo(this.pos);
            if(d < 5 && u.faction !== this.faction) {
                 u.applyForce(new THREE.Vector3((Math.random()-0.5)*10, 12.5, (Math.random()-0.5)*10));
                 u.takeDamage(damagePerSecond * dt);
            }
        });
        state.buildings.forEach(b => {
             const d = b.mesh.position.distanceTo(this.pos);
             if(d < 5 && b.faction !== this.faction) b.takeDamage(damagePerSecond * dt);
        });

        if(this.timer <= 0) {
            state.scene.remove(this.mesh);
            this.mesh.children.forEach(c => c.material.dispose()); // Clean up shared material
            return false;
        }
        return true;
    }
}

class Swarm extends ActiveEffect {
    constructor(x, z, faction) {
        super();
        this.pos = new THREE.Vector3(x, getHeight(x,z)+3, z);
        this.faction = faction;
        this.timer = 7.0;
        this.particles = [];
        const geo = new THREE.ConeGeometry(0.1, 0.4, 4);
        geo.rotateX(Math.PI/2); // Point forward
        const mat = new THREE.MeshBasicMaterial({color: 0x222222});

        for(let i=0; i<15; i++) {
            const p = new THREE.Mesh(geo, mat);
            p.position.set(this.pos.x + (Math.random()-0.5)*4, this.pos.y + (Math.random()-0.5)*2, this.pos.z + (Math.random()-0.5)*4);
            const targetOffset = new THREE.Vector3((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
            this.particles.push({mesh: p, targetOffset: targetOffset, vel: new THREE.Vector3()});
            state.scene.add(p);
        }
    }
    update(dt) {
        this.timer -= dt;

        // Move towards nearest enemy
        let closest = null; let minDist = 50;
        SpatialHash.query(this.pos.x, this.pos.z, 50).forEach(u => {
             if(u.faction !== this.faction && u.state !== 'dead') {
                 const d = u.mesh.position.distanceTo(this.pos);
                 if(d < minDist) { minDist = d; closest = u; }
             }
        });

        if(closest) {
             const dir = closest.mesh.position.clone().add(new THREE.Vector3(0,2,0)).sub(this.pos).normalize();
             this.pos.addScaledVector(dir, 10 * dt);
        } else {
             // Mill around
             this.pos.y = Math.max(getHeight(this.pos.x, this.pos.z) + 2, this.pos.y + Math.sin(this.timer) * dt);
        }

        // Update particles (boids like)
        this.particles.forEach(p => {
            // Update offset targets randomly
            if(Math.random() < 0.05) {
                p.targetOffset.set((Math.random()-0.5)*6, (Math.random()-0.5)*4, (Math.random()-0.5)*6);
            }
            const targetPos = this.pos.clone().add(p.targetOffset);

            // Steer
            const dir = targetPos.sub(p.mesh.position).normalize();
            p.vel.addScaledVector(dir, 20 * dt);

            // Speed limit
            if(p.vel.length() > 10) p.vel.normalize().multiplyScalar(10);

            p.mesh.position.addScaledVector(p.vel, dt);

            if(p.vel.lengthSq() > 0.1) {
                // Look in direction of travel
                const lookTarget = p.mesh.position.clone().add(p.vel);
                p.mesh.lookAt(lookTarget);
            }
        });

        // Damage
        SpatialHash.query(this.pos.x, this.pos.z, 4).forEach(u => {
            const d = u.mesh.position.distanceTo(this.pos);
            if(d < 4 && u.faction !== this.faction) {
                u.takeDamage(25 * dt);
            }
        });

        if(this.timer <= 0) {
            this.particles.forEach(p => {
                 state.scene.remove(p.mesh);
            });
            if(this.particles.length > 0) {
                 this.particles[0].mesh.geometry.dispose();
                 this.particles[0].mesh.material.dispose();
            }
            return false;
        }
        return true;
    }
}

function castLandbridge(caster, x, z) {
    if (!caster || !caster.mesh) return;
    const start = caster.mesh.position.clone();
    const targetH = getHeight(start.x, start.z);
    const dist = Math.sqrt((x - start.x)**2 + (z - start.z)**2);
    const steps = Math.ceil(dist);
    const dirX = (x - start.x) / dist;
    const dirZ = (z - start.z) / dist;

    const allMods = new Set();
    const r = 4; // Radius 4 for width 8

    for(let i=0; i<=steps; i++) {
        const px = start.x + dirX * i;
        const pz = start.z + dirZ * i;

        for(let ix = Math.floor(px - r); ix <= Math.ceil(px + r); ix++) {
            for(let iz = Math.floor(pz - r); iz <= Math.ceil(pz + r); iz++) {
                if((ix - px)**2 + (iz - pz)**2 <= r*r) {
                    const key = `${ix},${iz}`;
                    const base = getBaseHeight(ix, iz);
                    state.terrainMods.set(key, targetH - base);
                    const cx = Math.round(ix / CHUNK_SIZE);
                    const cz = Math.round(iz / CHUNK_SIZE);
                    allMods.add(`${cx},${cz}`);
                }
            }
        }
    }

    // Building collapse check
    state.buildings.forEach(b => {
        const groundH = getHeight(b.mesh.position.x, b.mesh.position.z);
        if(Math.abs(groundH - b.mesh.position.y) > 1.0) {
            b.takeDamage(100, true);
        }
    });

    updateChunks(true, allMods);
    SoundManager.playSound('rumble');
}

function executeSpell(type, x, z, caster) {
    if (!caster || !caster.mesh) return;

    if (caster.faction === 1 && caster.isShaman) {
        if(window.showEnemySpellIcon) window.showEnemySpellIcon(type);
    }

    if (type === 'blast') {
        const startPos = caster.mesh.position.clone().add(new THREE.Vector3(0, 2, 0));
        const h = getHeight(x, z);
        const targetPos = new THREE.Vector3(x, h, z);
        state.projectiles.push(new Fireball(startPos, targetPos, caster.faction));
        SoundManager.playSound('fireball');

        const dx = targetPos.x - caster.mesh.position.x;
        const dz = targetPos.z - caster.mesh.position.z;
        caster.mesh.rotation.y = Math.atan2(dx, dz);
    }
    else if (type === 'raise') {
        const mods = modifyTerrain(x, z, 5, 2.0);
        updateChunks(true, mods);
        spawnDust(x, getHeight(x, z), z, 0x696969, 5);
        SoundManager.playSound('rumble');
    }
    else if (type === 'lower') {
        const mods = modifyTerrain(x, z, 5, -2.0);
        updateChunks(true, mods);
        spawnDust(x, getHeight(x, z), z, 0xEEDC82, 5);
        SoundManager.playSound('rumble');
    }
    else if (type === 'volcano') {
        state.activeEffects.push(new Volcano(x, z, caster.faction));
        SoundManager.playSound('explosion');
    }
    else if (type === 'heal') {
        SoundManager.playSound('magic');

        SpatialHash.query(x, z, 8).forEach(u => {
            if(u.faction === caster.faction && u.state !== 'dead') {

    else if (type === 'teleport') {

        spawnExplosion(x, h, z, 0x0000FF, 10);

        caster.velocity.set(0, 0, 0);

    }
    else if (type === 'tornado') {
        state.activeEffects.push(new Tornado(x, z, caster.faction));
    }
    else if (type === 'swarm') {
        state.activeEffects.push(new Swarm(x, z, caster.faction));

    }
    else if (type === 'firestorm') {
        state.activeEffects.push(new Firestorm(x, z, caster.faction));
    }
    else if (type === 'shield') {
        SoundManager.playSound('magic');

        SpatialHash.query(x, z, 8).forEach(u => {
            if(u.faction === caster.faction) {
                const dist = u.mesh.position.distanceTo(new THREE.Vector3(x, u.mesh.position.y, z));

                }

        });

        const ringMat = new THREE.MeshBasicMaterial({color: 0xFF00FF, transparent: true, opacity: 0.8});
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.set(x, h + 1, z);

        state.particles.push(new VisualEffect(ringMesh, 1.5, (eff, dt) => {
             eff.mesh.rotation.z += dt * 5.0; // Spin
             const prog = eff.life / eff.maxLife;
             eff.mesh.scale.setScalar(prog); // Shrink
             eff.mesh.material.opacity = prog;
        }));

        SpatialHash.query(x, z, 8).forEach(u => {
            if(u.faction !== caster.faction && !u.isShaman) {
                 const dist = u.mesh.position.distanceTo(new THREE.Vector3(x, u.mesh.position.y, z));

                     u.conversionTimer = 10.0;
                     u.state = 'idle'; u.attackTarget = null;

                 }
            }
        });
    }
    else if (type === 'flatten') {
        // Flatten to average
        let totalH = 0; let count = 0;
        const r = 5;
        for(let ix = Math.floor(x - r); ix <= Math.ceil(x + r); ix++) {
            for(let iz = Math.floor(z - r); iz <= Math.ceil(z + r); iz++) {
                if((ix-x)**2 + (iz-z)**2 <= r*r) {
                    totalH += getHeight(ix, iz); count++;
                }
            }
        }
        if(count > 0) {
            const avg = totalH / count;
            const modifiedChunks = new Set();
            for(let ix = Math.floor(x - r); ix <= Math.ceil(x + r); ix++) {
                for(let iz = Math.floor(z - r); iz <= Math.ceil(z + r); iz++) {
                     if((ix-x)**2 + (iz-z)**2 <= r*r) {
                        const current = getHeight(ix, iz);
                        const key = `${ix},${iz}`;
                        const mod = state.terrainMods.get(key) || 0;
                        state.terrainMods.set(key, mod + (avg - current));
                        const cx = Math.round(ix / CHUNK_SIZE);
                        const cz = Math.round(iz / CHUNK_SIZE);
                        modifiedChunks.add(`${cx},${cz}`);
                     }
                }
            }
            updateChunks(true, modifiedChunks);
            spawnDust(x, getHeight(x, z), z, 0x696969, r);
            SoundManager.playSound('rumble');
        }
    }
    else if (type === 'landbridge') {
        castLandbridge(caster, x, z);
    }
    else if (type === 'swamp') {
         state.activeEffects.push(new Swamp(x, z, caster.faction));
         SoundManager.playSound('magic');
    }
    else if (type === 'lightning') {
        SoundManager.playSound('explosion');
        const h = getHeight(x,z);

        // Jagged Lightning Bolt
        const boltGroup = new THREE.Group();
        const mat = new THREE.MeshBasicMaterial({color: 0xFFFFFF, transparent: true, opacity: 1.0});

        let currentY = h + 30;
        let currentX = x;
        let currentZ = z;

        for(let i=0; i<10; i++) {
             let nextY = currentY - 3;
             let nextX = x + (Math.random()-0.5)*4;
             let nextZ = z + (Math.random()-0.5)*4;

             if(i===9) { nextX = x; nextZ = z; } // Snap to target at end

             const diff = new THREE.Vector3(nextX - currentX, nextY - currentY, nextZ - currentZ);
             const dist = diff.length();

             const segGeo = new THREE.CylinderGeometry(0.2, 0.2, dist, 8);
             const seg = new THREE.Mesh(segGeo, mat);
             seg.position.set(currentX + diff.x/2, currentY + diff.y/2, currentZ + diff.z/2);

             // Orient segment
             seg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), diff.normalize());
             boltGroup.add(seg);

             currentX = nextX; currentY = nextY; currentZ = nextZ;
        }

        const light = new THREE.PointLight(0xFFFFFF, 3, 30);
        light.position.set(x, h + 2, z);
        boltGroup.add(light);

        state.particles.push(new VisualEffect(boltGroup, 0.2, (eff, dt) => {
            eff.mesh.children.forEach(c => {
                 if(c.material) c.material.opacity = eff.life / eff.maxLife;
                 if(c.isLight) c.intensity = 3 * (eff.life / eff.maxLife);
            });
        }));

        spawnExplosion(x, h, z, 0xFFFFFF, 20);

        // Damage
        let hit = false;
        burnTreesAt(x, z, 5); // Burn trees
        SpatialHash.query(x, z, 4).forEach(u => {
             const dist = u.mesh.position.distanceTo(new THREE.Vector3(x, u.mesh.position.y, z));
             if(dist < 4 && u.faction !== caster.faction) {
                 u.takeDamage(400);
                 hit = true;
             }
        });
        state.buildings.forEach(b => {
             const dist = b.mesh.position.distanceTo(new THREE.Vector3(x, b.mesh.position.y, z));
             if(dist < 4 && b.faction !== caster.faction) {
                 b.takeDamage(400);
                 hit = true;
             }
        });
    }
}

    setShield(active) {

            const inner = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshBasicMaterial({color: 0x00FFFF, transparent: true, opacity: 0.2, depthWrite: false}));

            const outer = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9, 0), new THREE.MeshBasicMaterial({color: 0x00FFFF, transparent: true, opacity: 0.8, wireframe: true}));

                 c.geometry.dispose();
                 c.material.dispose();
            });
            this.shieldMesh = null;
        }
    }

    setInvisibility(active) {
        this.invisible = active;

        if (active) {
            // Store originals and apply clone
            if (!this.originalMats) this.originalMats = new Map();
            this.mesh.traverse(c => {
                if (c.isMesh && c.material) {
                    if (!this.originalMats.has(c)) {
                        this.originalMats.set(c, c.material);
                    }
                    const newMat = c.material.clone();
                    newMat.transparent = true;
                    newMat.opacity = 0.2;
                    c.material = newMat;
                }
            });
        } else {
            // Restore
            if (this.originalMats) {
                this.mesh.traverse(c => {
                    if (c.isMesh && this.originalMats.has(c)) {
                        c.material.dispose(); // Free clone
                        c.material = this.originalMats.get(c);
                    }
                });
                this.originalMats.clear();
            }
        }
    }

    die() {
        this.state = 'dead'; this.hpGroup.visible = false; if(this.marker) this.marker.visible = false; this.velocity.set(0, 0, 0);
    }

    applyForce(vec) {
        if(this.state === 'dead') return;
        this.velocity.add(vec); this.isGrounded = false; this.state = 'stunned'; this.recoverTimer = 5.0; this.target = null;
    }

    manualMove(vec, dt = 0.016) {
        if(this.state === 'dead' || this.state === 'stunned') return;
        const speed = this.moveSpeed;

        // Check collision and water
        let allowed = true;
        if(this.type !== 'airship') {
             // Simple lookahead
             const futureX = this.mesh.position.x + vec.x * speed * 0.1;
             const futureZ = this.mesh.position.z + vec.z * speed * 0.1;
             const futureH = getHeight(futureX, futureZ);
             const safeH = WATER_LEVEL - 2.2; // Use Shaman height

             // If moving into water deeper than unit height
             const currentH = getHeight(this.mesh.position.x, this.mesh.position.z);
             if(futureH < safeH && currentH >= safeH) {
                 allowed = false;
             }
             if(isBlocked(futureX, futureZ)) {
                  allowed = false;
             }
        }

        if(allowed) {
            const targetVelX = vec.x * speed;
            const targetVelZ = vec.z * speed;
            const lerpFactor = 5.0;

            this.velocity.x += (targetVelX - this.velocity.x) * lerpFactor * dt;
            this.velocity.z += (targetVelZ - this.velocity.z) * lerpFactor * dt;

            if(vec.lengthSq() > 0.001) {
                const targetRot = Math.atan2(vec.x, vec.z);
                let rotDiff = targetRot - this.mesh.rotation.y;
                while(rotDiff > Math.PI) rotDiff -= Math.PI*2;
                while(rotDiff < -Math.PI) rotDiff += Math.PI*2;
                this.mesh.rotation.y += rotDiff * 5.0 * dt;
            }
        } else {
            const friction = 5.0;
            this.velocity.x -= this.velocity.x * friction * dt;
            this.velocity.z -= this.velocity.z * friction * dt;
        }

        this.state = 'manual';
        this.target = null;
        this.path = [];
    }

    goto(x, z) {
        if(this.state === 'stunned' || this.state === 'dead') return;
        const end = new THREE.Vector3(x, 0, z);
        this.finalDest = end.clone();
        const isFlying = (this.type === 'airship');
        const rawPath = Pathfinder.findPath(this.mesh.position, end, isFlying, this.height);

        if (rawPath) {
            this.path = smoothPath(rawPath, isFlying, this.height);
            this.pathIndex = 0;
            if(this.path.length > 0) {
                this.target = this.path[0];
                this.state = 'move';
            } else {
                this.target = end; this.state = 'move';
            }
        } else {
            if (isFlying) {
                this.target = end; this.state = 'move';
                this.path = [];
            } else {
                this.state = 'idle';
                this.target = null;
                this.path = [];
            }
        }
    }

    findTarget() {
         let minDist = 1000;
         let closest = null;
         const range = 30;
         const candidates = SpatialHash.query(this.mesh.position.x, this.mesh.position.z, range);

         for(let i=0; i<candidates.length; i++) {
             const u = candidates[i];
             if(!window.isAllied(u.faction, this.faction) && u.state !== 'dead' && !u.invisible) {
                 const d = this.mesh.position.distanceTo(u.mesh.position);
                 if(d < range && d < minDist) {
                     minDist = d; closest = u;
                 }
             }
         }
         return closest;
    }

    attack() {
        if(!this.attackTarget || this.attackTarget.state === 'dead') {
             this.state = 'idle'; this.attackTarget = null; return;
        }

        this.mesh.lookAt(this.attackTarget.mesh.position.x, this.mesh.position.y, this.attackTarget.mesh.position.z);

        // Animation
        const t = this.animTime * 10;
        this.armR.rotation.x = -Math.PI/2 + Math.sin(t) * 0.5; // Swing

        // Deal damage at right time
        // Simplified: just check cooldown
        if(state.clock.getElapsedTime() - this.lastAttackTime > (1.0/this.attackSpeed)) {
            this.lastAttackTime = state.clock.getElapsedTime();
            if(this.type === 'firewarrior') {
                // Spawn Fireball
                 const startPos = this.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0));
                 const targetPos = this.attackTarget.mesh.position.clone().add(new THREE.Vector3(0, 1, 0));
                 state.projectiles.push(new Fireball(startPos, targetPos, this.faction));
                 SoundManager.playSound('fireball');
            } else if (this.type === 'spy') {
                // Spy Conversion
                const target = this.attackTarget;
                if (!target.isShaman) {
                    if (target.originalFaction === null || target.originalFaction === undefined) target.originalFaction = target.faction;
                    if (!window.isAllied(target.faction, this.faction)) {
                        target.setFaction(this.faction);
                        target.attackTarget = null; // Stop attacking
                        target.state = 'idle';
                    }
                    target.conversionTimer = 3.0; // Refresh timer

                    SoundManager.playSound('magic');
                }
            } else {
                // Melee
                this.attackTarget.takeDamage(this.damage, true);
                SoundManager.playSound('attack');
            }
        }
    }

    update(dt) {
        if(this.state === 'transported') return;

        if (state.network.role === 'client') {
            this.hpGroup.lookAt(state.camera.position);
            return;
        }

        if (this.burnTimer > 0) {
            this.burnTimer -= dt;
            if(Math.random() < 0.25) {
                state.particles.push(new Particle(this.mesh.position.clone().add(new THREE.Vector3((Math.random()-0.5), 1, (Math.random()-0.5))), 0xFF4500, 0.1, 0.5));
            }
            // Optional: DOT
            // this.takeDamage(5 * dt);
        }

        if (this.conversionTimer > 0) {
            this.conversionTimer -= dt;
            if (this.conversionTimer <= 0) {
                if (this.originalFaction !== null) {
                    this.setFaction(this.originalFaction);
                    this.originalFaction = null;
                    this.state = 'idle'; // Reset state on revert
                    this.attackTarget = null;

                }
                this.conversionTimer = 0;
            }
        }

        if (this.shielded && this.shieldMesh) {
             this.shieldMesh.children[1].rotation.x += dt * 1.5;
             this.shieldMesh.children[1].rotation.y += dt * 2.0;
        }

        this.hpGroup.lookAt(state.camera.position); this.animTime += dt;
        if(!this.isGrounded) this.velocity.y -= 30 * dt;
        else { this.velocity.x *= 0.9; this.velocity.z *= 0.9; }
        this.mesh.position.addScaledVector(this.velocity, dt);

        const groundH = getHeight(this.mesh.position.x, this.mesh.position.z);
        const feetOffset = 0.1 * this.mesh.scale.y;

        if (this.type === 'airship') {
            const targetAlt = Math.max(groundH, WATER_LEVEL) + 8.0; // Fly above water or ground
            const diff = targetAlt - this.mesh.position.y;
            this.velocity.y += diff * dt * 5.0;
            this.velocity.y *= 0.9;
            this.isGrounded = false;
            // Always fly above terrain
            const minAlt = Math.max(groundH, WATER_LEVEL) + 2.0;
            if(this.mesh.position.y < minAlt) {
                this.mesh.position.y = minAlt;
                this.velocity.y = Math.max(0, this.velocity.y);
            }
        } else {
            const targetY = groundH - feetOffset;
            if (this.mesh.position.y < targetY) {
                if(this.velocity.y < -15 && this.state !== 'dead' && !this.isShaman) this.takeDamage(20, true);
                this.mesh.position.y = targetY;
                this.isGrounded = true; this.velocity.y = 0;
                if(this.state === 'stunned' && this.velocity.length() < 1) { this.state = 'idle'; this.mesh.rotation.z = 0; this.mesh.rotation.x = 0; }
            } else if (this.mesh.position.y > targetY + 0.1) { this.isGrounded = false; }
        }

        // Deep Water Damage
        if (this.type !== 'airship' && this.state !== 'dead') {
            const h = groundH;
            const safeH = WATER_LEVEL - 2.2; // Use Shaman height
            if (h < safeH) {
                this.takeDamage(this.maxHp * 0.10 * dt, true);
            }
        }

        // Building Entry Check for Training
        if(this.type === 'wild' && this.state !== 'dead') {
             state.buildings.forEach(b => {
                 // Only train in buildings of the same faction
                 if (!window.isAllied(this.faction, b.faction)) return;
                 // Check if building is ready to train?
                 // For now instant training logic
                 const dist = this.mesh.position.distanceTo(b.mesh.position);
                 if(dist < 4.0 && b.hp > 0) {
                     let newType = null;
                     if(b.type === 'warrior') newType = 'warrior';
                     if(b.type === 'fire') newType = 'firewarrior';
                     if(b.type === 'spy') newType = 'spy'; // not implemented fully visual wise but logic is here

                     if(newType) {
                         // Enter building
                         this.die(); // Remove old unit
                         state.scene.remove(this.mesh); // Hide immediately
                         this.hp = 0; // Ensure cleaned up

                         // Start training timer on building
                         if(!b.trainingQueue) b.trainingQueue = [];
                         b.trainingQueue.push({
                             timer: 2.0,
                             type: newType,
                             faction: this.faction
                         });
                         spawnPulse(b.mesh.position.x, b.mesh.position.y+2, b.mesh.position.z, 0x00FF00);
                     }
                 }
             });
        }

        if (this.state === 'dead') {
            this.deathTimer += dt;
            if(this.mesh.rotation.x > -Math.PI/2) this.mesh.rotation.x -= dt * 5;

            if (this.deathTimer > 95) {
                if(this.mesh.position.y > groundH - 2.0) this.mesh.position.y -= dt * 0.5;
            }
            return;
        }

        // Passive Healing near Buildings
        if(this.hp < this.maxHp && this.state !== 'combat') {
            let nearBuilding = false;
            for(let b of state.buildings) {
                if(window.isAllied(b.faction, this.faction) && !b.dead) {
                    const dist = this.mesh.position.distanceTo(b.mesh.position);
                    if(dist < 8.0) {
                        nearBuilding = true;
                        break;
                    }
                }
            }
            if(nearBuilding) {
                this.hp += dt * 10;
                if(this.hp > this.maxHp) this.hp = this.maxHp;
                this.hpBar.scale.x = Math.max(0, this.hp / this.maxHp);

                this.healTimer = (this.healTimer || 0) + dt;
                if(this.healTimer > 0.5) {
                    spawnHealing(this.mesh.position.x, this.mesh.position.y + 2, this.mesh.position.z);
                    this.healTimer = 0;
                }
            }
        }

        if(this.state === 'stunned') {
            if(this.velocity.length() > 2 || !this.isGrounded) {
                 this.mesh.rotation.x += dt * 5; this.mesh.rotation.z += dt * 3;
                 if(this.legL) {
                    this.legL.rotation.x = Math.sin(this.animTime * 15); this.legR.rotation.x = Math.sin(this.animTime * 15 + Math.PI);
                    this.armL.rotation.x = Math.sin(this.animTime * 15); this.armR.rotation.x = Math.sin(this.animTime * 15 + Math.PI);
                 }
            } else {
                this.recoverTimer -= dt;
                const targetRotX = -Math.PI/2;
                this.mesh.rotation.x += (targetRotX - this.mesh.rotation.x) * 5 * dt;
                this.mesh.rotation.z *= 0.9;
                this.resetAnim();
                if(this.recoverTimer <= 0) {
                    this.state = 'getting_up';
                    this.getUpTimer = 0.5;
                }
            }
        }
        else if(this.state === 'getting_up') {
            this.getUpTimer -= dt;
            const progress = Math.max(0, Math.min(1.0, 1.0 - (this.getUpTimer / 0.5)));
            // Cubic Ease Out: 1 - pow(1 - x, 3)
            const ease = 1 - Math.pow(1 - progress, 3);
            this.mesh.rotation.x = -Math.PI/2 * (1 - ease);
            this.mesh.rotation.z *= 0.8; // Also correct Z tilt
            if (this.getUpTimer <= 0) {
                 this.state = 'idle';
                 this.mesh.rotation.x = 0;
                 this.mesh.rotation.z = 0;
            }
        }
        else if(this.state === 'manual') {
            if(this.velocity.lengthSq() > 0.1) {
                if(this.legL) {
                    const walkSpeed = 10; const amp = 0.8;
                    this.legL.rotation.x = Math.sin(this.animTime * walkSpeed) * amp;
                    this.legR.rotation.x = Math.sin(this.animTime * walkSpeed + Math.PI) * amp;
                    this.armL.rotation.x = Math.sin(this.animTime * walkSpeed + Math.PI) * amp * 0.6;
                    this.armR.rotation.x = Math.sin(this.animTime * walkSpeed) * amp * 0.6;
                }
            } else {
                this.resetAnim();
            }
        }
        else if(this.state === 'combat') {
            if(!this.attackTarget || this.attackTarget.state === 'dead') {
                // Try find new target
                this.attackTarget = this.findTarget();
                if(!this.attackTarget) { this.state = 'idle'; return; }
            }

            const dist = this.mesh.position.distanceTo(this.attackTarget.mesh.position);
            if(dist <= this.range) {
                // In range, attack
                this.velocity.set(0,0,0);
                this.attack();
            } else {
                // Pathfinding for combat
                this.pathTimer += dt;
                let targetPos = this.attackTarget.mesh.position;

                if(this.pathTimer > 1.0) {
                     this.pathTimer = 0;
                     const isFlying = (this.type === 'airship');
                     this.path = Pathfinder.findPath(this.mesh.position, targetPos, isFlying, this.height);
                     this.pathIndex = 0;
                }

                if(this.path && this.path.length > 0 && this.pathIndex < this.path.length) {
                    targetPos = this.path[this.pathIndex];
                    if(this.mesh.position.distanceTo(targetPos) < 1.0) {
                        this.pathIndex++;
                        if(this.pathIndex < this.path.length) targetPos = this.path[this.pathIndex];
                    }
                }

                // Move towards
                const dx = targetPos.x - this.mesh.position.x;
                const dz = targetPos.z - this.mesh.position.z;
                const dir = new THREE.Vector3(dx, 0, dz).normalize();

                // Slope check
                const nextH = getHeight(this.mesh.position.x + dir.x, this.mesh.position.z + dir.z);
                const currentH = groundH;
                const dh = nextH - currentH;

                let canMove = true;
                const safeH = WATER_LEVEL - 2.2; // Use Shaman height
                if (this.type !== 'airship' && nextH < safeH && currentH >= safeH) canMove = false;

                if(canMove) {
                    const slopeFactor = dh > 0 ? (1.0 / (1.0 + dh * 3.0)) : 1.0;
                    const speed = this.moveSpeed * (this.type === 'airship' ? 1.0 : slopeFactor);
                    const targetVelX = dir.x * speed;
                    const targetVelZ = dir.z * speed;
                    this.velocity.x += (targetVelX - this.velocity.x) * 5.0 * dt;
                    this.velocity.z += (targetVelZ - this.velocity.z) * 5.0 * dt;

                    const targetRot = Math.atan2(dx, dz);
                    let rotDiff = targetRot - this.mesh.rotation.y;
                    while(rotDiff > Math.PI) rotDiff -= Math.PI*2;
                    while(rotDiff < -Math.PI) rotDiff += Math.PI*2;
                    this.mesh.rotation.y += rotDiff * 5.0 * dt;
                } else {
                    this.velocity.x *= 0.9;
                    this.velocity.z *= 0.9;
                }

                // Walk Anim
                if(this.legL) {
                    const walkSpeed = 10; const amp = 0.8;
                    this.legL.rotation.x = Math.sin(this.animTime * walkSpeed) * amp;
                    this.legR.rotation.x = Math.sin(this.animTime * walkSpeed + Math.PI) * amp;
                    this.armL.rotation.x = Math.sin(this.animTime * walkSpeed + Math.PI) * amp * 0.6;
                    this.armR.rotation.x = Math.sin(this.animTime * walkSpeed) * amp * 0.6;
                }
            }
        }
        else if(this.state === 'move' && this.target && (this.isGrounded || this.type === 'airship')) {
            // Stuck Detection
            const movedDist = this.mesh.position.distanceTo(this.lastPos);
            if(dt > 0.001) {
                if(movedDist < this.moveSpeed * dt * 0.2) {
                    this.stuckTimer += dt;
                    if(this.stuckTimer > this.stuckThreshold && this.finalDest) {
                        this.stuckTimer = 0;
                        this.stuckThreshold = 2.0 + Math.random();
                        const isFlying = (this.type === 'airship');
                        const newPath = Pathfinder.findPath(this.mesh.position, this.finalDest, isFlying, this.height);
                        if (newPath) {
                            this.path = newPath;
                            this.pathIndex = 0;
                            if(this.path.length > 0) this.target = this.path[0];
                        }
                    }
                } else {
                    this.stuckTimer = 0;
                }
            }
            this.lastPos.copy(this.mesh.position);

            let dx = this.target.x - this.mesh.position.x;
            let dz = this.target.z - this.mesh.position.z;
            let dist = Math.sqrt(dx*dx + dz*dz);

            // Update Path
            if(dist < 1.0) {
                 this.pathIndex++;
                 if(this.path && this.pathIndex < this.path.length) {
                     this.target = this.path[this.pathIndex];
                     dx = this.target.x - this.mesh.position.x;
                     dz = this.target.z - this.mesh.position.z;
                     dist = Math.sqrt(dx*dx + dz*dz);
                 } else {
                    this.state = 'idle'; this.velocity.set(0,0,0); this.resetAnim();
                    this.targetBoat = null;
                    this.path = [];
                    return;
                 }
            }

            // Check boat entry while moving (allow early entry)
            if(this.targetBoat && this.targetBoat.state !== 'dead') {
                 // 3D distance check, ignore Y difference essentially for trigger
                 const distSq = (this.mesh.position.x - this.targetBoat.mesh.position.x)**2 + (this.mesh.position.z - this.targetBoat.mesh.position.z)**2;
                 if(distSq < 25.0) { // 5.0 distance squared
                     if(this.targetBoat.loadUnit(this)) {
                         this.targetBoat = null;
                         this.state = 'idle'; this.velocity.set(0,0,0);
                         return;
                     }
                 }
            }

            if(true) {
                const dir = new THREE.Vector3(dx, 0, dz).normalize();

                // Slope check
                const nextH = getHeight(this.mesh.position.x + dir.x, this.mesh.position.z + dir.z);
                const dh = nextH - groundH;

                let canMove = true;
                if(this.type !== 'airship') {
                    const currentH = groundH;
                    const safeH = WATER_LEVEL - 2.2; // Use Shaman height
                    if (nextH < safeH && currentH >= safeH) {
                         if(!this.targetBoat) canMove = false;
                    }
                }

                if(canMove) {
                    const slopeFactor = dh > 0 ? (1.0 / (1.0 + dh * 3.0)) : 1.0;
                    const speed = this.moveSpeed * (this.type === 'airship' ? 1.0 : slopeFactor);
                    const targetVelX = dir.x * speed;
                    const targetVelZ = dir.z * speed;
                    this.velocity.x += (targetVelX - this.velocity.x) * 5.0 * dt;
                    this.velocity.z += (targetVelZ - this.velocity.z) * 5.0 * dt;

                    const targetRot = Math.atan2(dx, dz);
                    let rotDiff = targetRot - this.mesh.rotation.y;
                    while(rotDiff > Math.PI) rotDiff -= Math.PI*2;
                    while(rotDiff < -Math.PI) rotDiff += Math.PI*2;
                    this.mesh.rotation.y += rotDiff * 5.0 * dt;
                } else {
                     this.velocity.x *= 0.9; this.velocity.z *= 0.9;
                     if(this.velocity.lengthSq() < 0.1) {
                         this.state = 'idle'; // Stop moving if hit water/stuck
                         this.resetAnim();
                     }
                }
                this.mesh.rotation.x = 0; this.mesh.rotation.z = 0;
                if(this.legL) {
                    const walkSpeed = 10; const amp = 0.8;
                    this.legL.rotation.x = Math.sin(this.animTime * walkSpeed) * amp;
                    this.legR.rotation.x = Math.sin(this.animTime * walkSpeed + Math.PI) * amp;
                    this.armL.rotation.x = Math.sin(this.animTime * walkSpeed + Math.PI) * amp * 0.6;
                    this.armR.rotation.x = Math.sin(this.animTime * walkSpeed) * amp * 0.6;
                    this.torso.position.y = 0.9 + Math.abs(Math.sin(this.animTime * walkSpeed)) * 0.05;
                }
            }
        } else {
            // Idle Check Aggro
            // All unselected units auto aggro
            if (!state.selectedUnits.includes(this)) {
                if (state.clock.getElapsedTime() > this.nextTargetCheck) {
                    this.nextTargetCheck = state.clock.getElapsedTime() + 0.5 + Math.random() * 0.5;
                    const target = this.findTarget();
                    if(target) {
                        this.attackTarget = target;
                        this.state = 'combat';
                    }
                }
            }

            this.resetAnim();
            if(this.torso) {
                this.torso.position.y = 0.9 + Math.sin(this.animTime * 2) * 0.02;
                this.armL.rotation.z = Math.sin(this.animTime) * 0.05 + 0.1;
                this.armR.rotation.z = -Math.sin(this.animTime) * 0.05 - 0.1;
            }
            // Robust upright correction
            this.mesh.rotation.x *= 0.8; this.mesh.rotation.z *= 0.8;
            if(Math.abs(this.mesh.rotation.x) < 0.01) this.mesh.rotation.x = 0;
            if(Math.abs(this.mesh.rotation.z) < 0.01) this.mesh.rotation.z = 0;
        }

        if(this.type === 'firewarrior' && this.state !== 'dead') {
            if(Math.random() < 0.15) {
                 const spawnFire = (limb) => {
                     const pos = new THREE.Vector3();
                     limb.getWorldPosition(pos);
                     pos.y -= 0.2;
                     const p = new Particle(pos.add(new THREE.Vector3((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2)), 0xFF4500, 0.1, 0.5);
                     p.vel.set(0, 1, 0);
                     state.particles.push(p);
                 };
                 if(this.armL) spawnFire(this.armL);
                 if(this.armR) spawnFire(this.armR);
            }
        }
    }
    resetAnim() {
        const lerp = 0.1;
        if(this.legL) this.legL.rotation.x += (0 - this.legL.rotation.x) * lerp;
        if(this.legR) this.legR.rotation.x += (0 - this.legR.rotation.x) * lerp;
        if(this.armL) this.armL.rotation.x += (0 - this.armL.rotation.x) * lerp;
        if(this.armR) this.armR.rotation.x += (0 - this.armR.rotation.x) * lerp;
    }

    loadUnit(u) {
        if(this.passengers.length >= this.capacity) return false;
        this.passengers.push(u);
        u.mesh.visible = false;
        u.state = 'transported';
        u.transportedBy = this;
        return true;
    }

    unload() {
        if(!this.passengers.length) return;

        // Unload below airship if safe, or find safe spot
        const r = 5; // Scan larger area
        for(let i=this.passengers.length-1; i>=0; i--) {
            const p = this.passengers[i];
            // Check directly below first
            let tx = this.mesh.position.x;
            let tz = this.mesh.position.z;
            if (getHeight(tx, tz) < WATER_LEVEL) {
                // Try find land in radius
                let found = false;
                for(let dist=1; dist<=r; dist+=1) {
                    for(let angle=0; angle<Math.PI*2; angle+=0.5) {
                        const scanX = this.mesh.position.x + Math.cos(angle)*dist;
                        const scanZ = this.mesh.position.z + Math.sin(angle)*dist;
                        if(getHeight(scanX, scanZ) >= WATER_LEVEL) {
                            tx = scanX; tz = scanZ; found = true; break;
                        }
                    }
                    if(found) break;
                }
                if(!found) continue; // Can't unload this unit safely yet
            }

            p.mesh.position.set(tx, getHeight(tx, tz), tz);
            p.mesh.visible = true;
            p.state = 'idle';
            p.transportedBy = null;
            this.passengers.splice(i, 1);
            spawnPulse(tx, p.mesh.position.y, tz, 0xFFFFFF);
        }
    }
}


// --- js/building.js ---

function createBuilding(type, x, z, faction = 0, autoUpdate = true, isLoading = false, id = null) {
    if(!isLoading && getHeight(x, z) < WATER_LEVEL) return null;

    if(!isLoading) SoundManager.playSound('construct');
    const baseH = getHeight(x, z);
    const radius = 3;

    // Auto-Leveling
    if(!isLoading) {
        const modifiedChunks = new Set();
        for(let ix = Math.floor(x - radius); ix <= Math.ceil(x + radius); ix++) {
            for(let iz = Math.floor(z - radius); iz <= Math.ceil(z + radius); iz++) {
                const dist = Math.sqrt((ix-x)**2 + (iz-z)**2);
                if(dist <= radius) {
                    const key = `${ix},${iz}`;
                    const naturalH = getBaseHeight(ix, iz);
                    const targetMod = baseH - naturalH;
                    state.terrainMods.set(key, targetMod);
                    const cx = Math.round(ix / CHUNK_SIZE);
                    const cz = Math.round(iz / CHUNK_SIZE);
                    modifiedChunks.add(`${cx},${cz}`);
                }
            }
        }
        if(autoUpdate) updateChunks(true, modifiedChunks);
    }

    const group = new THREE.Group();
    group.position.set(x, baseH, z);

    let mesh, maxHp;
    if (type === 'hut') { mesh = buildHut(); maxHp = 100; }
    else if (type === 'tower') { mesh = buildTower(); maxHp = 150; }
    else if (type === 'warrior') { mesh = buildBarracks(); maxHp = 250; }
    else if (type === 'fire') { mesh = buildFireTemple(); maxHp = 300; }
    else if (type === 'spy') { mesh = buildSpyHut(); maxHp = 200; }
    else if (type === 'shipyard') { mesh = buildShipyard(); maxHp = 350; }

    if(mesh) {
        group.add(mesh);

        // HP Bar for Building
        const hpGroup = new THREE.Group();
        hpGroup.position.set(0, 5, 0); // High above the building
        const bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.3), new THREE.MeshBasicMaterial({color: 0x880000}));
        hpGroup.add(bgMesh);
        const fgGeo = new THREE.PlaneGeometry(2.0, 0.3); fgGeo.translate(1.0, 0, 0);
        const hpBar = new THREE.Mesh(fgGeo, new THREE.MeshBasicMaterial({color: 0x00FF00}));
        hpBar.position.x = -1.0;
        hpGroup.add(hpBar);
        group.add(hpGroup);

        state.scene.add(group);

        // Construction logic
        const buildTime = BUILDING_COSTS[type] || 5; // Default 5s if not found
        if(!isLoading) mesh.scale.y = 0.01; // Start flat only if new

        const building = {
            id: id || generateUUID(),
            mesh: group,
            visualMesh: mesh,
            hpBar: hpBar,
            hpGroup: hpGroup,
            type: type,
            faction: faction,
            hp: maxHp,
            maxHp: maxHp,
            constructionTimer: buildTime,
            totalBuildTime: buildTime,
            underConstruction: true,
            burnTimer: 0,
            trainingQueue: [],
            takeDamage: function(amount, silent = false) {
                this.hp -= amount;
                this.hpBar.scale.x = Math.max(0, this.hp / this.maxHp);
                if (!silent) spawnPulse(this.mesh.position.x, this.mesh.position.y + 2, this.mesh.position.z, 0xFF4500);
                if(this.hp <= 0) {
                    this.destroy();
                }
            },
            destroy: function() {
                this.dead = true;
                state.scene.remove(this.mesh);
                spawnExplosion(this.mesh.position.x, this.mesh.position.y, this.mesh.position.z, COLORS.wood, 20);
                SoundManager.playSound('explosion');
                BuildingSpatialHash.markDirty();
            },
            update: function(dt) {
                this.hpGroup.lookAt(state.camera.position);
                if (state.network.role === 'client') return;

                if(this.burnTimer > 0) {
                    this.burnTimer -= dt;
                    if(Math.random() < 0.25) {
                        state.particles.push(new Particle(this.mesh.position.clone().add(new THREE.Vector3((Math.random()-0.5)*2, 2, (Math.random()-0.5)*2)), 0xFF4500, 0.15, 0.5));
                    }
                }

                if(this.underConstruction) {
                    this.constructionTimer -= dt;
                    const progress = 1.0 - (this.constructionTimer / this.totalBuildTime);
                    this.visualMesh.scale.y = Math.max(0.01, progress);

                    if(this.constructionTimer <= 0) {
                        this.underConstruction = false;
                        BuildingSpatialHash.markDirty();
                        this.visualMesh.scale.y = 1.0;
                        spawnExplosion(this.mesh.position.x, this.mesh.position.y, this.mesh.position.z, 0xFFFFFF, 10);

                        // On Complete Logic
                        if(this.type === 'hut') {
                            // Spawn initial brave
                            const safe = findNearestLand(this.mesh.position.x + 2, this.mesh.position.z + 2, 10);
                            const u = new Humanoid(this.faction, 'wild', safe.x, safe.z);
                            state.units.push(u);

                        }
                    }
                    return; // Skip other updates while building
                }

                // Handle Training Queue
                if(this.trainingQueue && this.trainingQueue.length > 0) {
                    for(let i = this.trainingQueue.length - 1; i >= 0; i--) {
                        const task = this.trainingQueue[i];
                        task.timer -= dt;
                        if(task.timer <= 0) {
                            const safe = findNearestLand(this.mesh.position.x + 2, this.mesh.position.z + 2, 10);
                            const u = new Humanoid(task.faction, task.type, safe.x, safe.z);
                            state.units.push(u);
                            spawnPulse(u.mesh.position.x, u.mesh.position.y, u.mesh.position.z, 0xFFD700);
                            this.trainingQueue.splice(i, 1);
                        }
                    }
                }
            }
        };

        state.buildings.push(building);
        if(!isLoading) spawnExplosion(x, baseH, z, 0xFFD700, 15);
        return building;
    }
    return null;
}

function buildHut() {
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 1.5, 16), new THREE.MeshStandardMaterial({color: COLORS.wood, roughness: 0.8, metalness: 0.0}));
    base.position.y = 0.75; base.castShadow = true; base.receiveShadow = true; g.add(base);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(1.8, 1.5, 16), new THREE.MeshStandardMaterial({color: COLORS.straw, roughness: 1.0, metalness: 0.0}));
    roof.position.y = 1.5 + 0.75; roof.castShadow = true; roof.receiveShadow = true; g.add(roof);
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.2), new THREE.MeshStandardMaterial({color: 0x220000, roughness: 0.8, metalness: 0.0}));
    door.position.set(0, 0.5, 1.35); door.castShadow = true; door.receiveShadow = true; g.add(door);

    // Add small window
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.2), new THREE.MeshStandardMaterial({color: 0x88CCFF, emissive: 0x112233, roughness: 0.2, metalness: 0.8}));
    win.position.set(1.0, 1.0, 0.8); win.rotation.y = Math.PI / 4; win.castShadow = true; win.receiveShadow = true; g.add(win);
    return g;
}
function buildTower() {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 1.0, 4, 12), new THREE.MeshStandardMaterial({color: COLORS.wood, roughness: 0.8, metalness: 0.0}));
    body.position.y = 2; body.castShadow = true; body.receiveShadow = true; g.add(body);
    const plat = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.2, 0.5, 12), new THREE.MeshStandardMaterial({color: COLORS.wood, roughness: 0.8, metalness: 0.0}));
    plat.position.y = 3.8; plat.castShadow = true; plat.receiveShadow = true; g.add(plat);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(1.5, 1.0, 12), new THREE.MeshStandardMaterial({color: COLORS.straw, roughness: 1.0, metalness: 0.0}));
    roof.position.y = 4.5; roof.castShadow = true; roof.receiveShadow = true; g.add(roof);

    // Add supports
    for(let i=0; i<4; i++) {
        const support = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.2, 8), new THREE.MeshStandardMaterial({color: COLORS.wood, roughness: 0.9, metalness: 0.0}));
        const angle = (i / 4) * Math.PI * 2;
        support.position.set(Math.cos(angle)*1.0, 3.4, Math.sin(angle)*1.0);
        support.rotation.x = Math.sin(angle) * 0.4;
        support.rotation.z = -Math.cos(angle) * 0.4;
        support.castShadow = true; support.receiveShadow = true;
        g.add(support);
    }
    return g;
}

// --- js/ai.js ---

class EnemyAI {
    constructor(faction) { this.faction = faction;
        this.timer = 0;
        this.state = 'build'; // 'build', 'attack'
        this.baseX = 0;
        this.baseZ = 0;
        this.lastBridgeTime = 0;
        this.lastSpellTime = 0;
        this.lastPathCheckTime = 0;
        this.hasPathToPlayer = false;
        this.myShaman = null;

        // Track losses for rebuilding
        this.targetHutCount = 5;
        this.knownUnitCounts = { warrior: 0, firewarrior: 0, spy: 0, airship: 0 };
        this.lossQueue = [];
    }

    init(x, z) {
        // Ensure base is on land
        const startSafe = findNearestLand(x, z, 50);
        this.baseX = startSafe.x;
        this.baseZ = startSafe.z;

        // Create initial base
        createBuilding('hut', this.baseX, this.baseZ, this.faction);
        // Create Enemy Shaman
        const shamanSafe = findNearestLand(this.baseX - 5, this.baseZ - 5, 20);
        this.myShaman = new Humanoid(this.faction, 'shaman', shamanSafe.x, shamanSafe.z);
        state.units.push(this.myShaman);
        // Create initial Brave
        const braveSafe = findNearestLand(this.baseX + 2, this.baseZ + 2, 10);
        state.units.push(new Humanoid(this.faction, 'wild', braveSafe.x, braveSafe.z));
    }

    update(dt) {
        this.timer += dt;
        if(this.timer > 5.0) {
            this.timer = 0;
            this.think();
        }
        this.updateShaman(dt);
    }

    updateShaman(dt) {
        if (!this.myShaman || this.myShaman.state === 'dead') {
            this.myShaman = state.units.find(u => u.faction === this.faction && u.isShaman && u.state !== 'dead');
        }

        const myShaman = this.myShaman;
        const playerShaman = state.shaman;

        if (myShaman && playerShaman && playerShaman.state !== 'dead') {
            // If moving along a valid path, don't bridge (prefer land path)
            if (myShaman.state === 'move' && myShaman.path && myShaman.path.length > 0) return;

            // Bridge Logic - Frequent check
            if (state.clock.getElapsedTime() - this.lastBridgeTime > 1.0) {
                if (state.clock.getElapsedTime() - this.lastPathCheckTime > 1.0) {
                    this.lastPathCheckTime = state.clock.getElapsedTime();
                    this.hasPathToPlayer = !!Pathfinder.findPath(myShaman.mesh.position, playerShaman.mesh.position, false, myShaman.height);
                }
                if (this.hasPathToPlayer) return;

                const dir = playerShaman.mesh.position.clone().sub(myShaman.mesh.position).normalize();

                // Cast Bridge or Raise
                const castPos = myShaman.mesh.position.clone().addScaledVector(dir, 5.0);
                const h = getHeight(castPos.x, castPos.z);
                if (h < WATER_LEVEL) {
                    executeSpell('raise', castPos.x, castPos.z, myShaman);
                } else {
                    executeSpell('landbridge', castPos.x, castPos.z, myShaman);
                }
                this.lastBridgeTime = state.clock.getElapsedTime();
            }
        }
    }

    think() {
        // Get Enemy Units
        const myUnits = state.units.filter(u => u.faction === this.faction && u.state !== 'dead');
        const myBuildings = state.buildings.filter(b => b.faction === this.faction && !b.dead);

        // 1. Train Units
        const myBraves = myUnits.filter(u => u.type === 'wild');
        const trainingBuildings = myBuildings.filter(b => ['warrior', 'fire', 'spy', 'shipyard'].includes(b.type));

        // Count my units by type
        const unitCounts = { warrior: 0, firewarrior: 0, spy: 0, airship: 0 };
        myUnits.forEach(u => { if(unitCounts[u.type] !== undefined) unitCounts[u.type]++; });

        // Check for losses and update target hut counts
        Object.keys(this.knownUnitCounts).forEach(type => {
            if (unitCounts[type] < this.knownUnitCounts[type]) {
                const losses = this.knownUnitCounts[type] - unitCounts[type];
                this.targetHutCount += losses;
                for(let i=0; i<losses; i++) this.lossQueue.push(type);
            }
            this.knownUnitCounts[type] = unitCounts[type];
        });

        // Count our current buildings
        const currentCounts = { hut: 0, tower: 0, warrior: 0, fire: 0, spy: 0, shipyard: 0 };
        myBuildings.forEach(b => { if(currentCounts[b.type] !== undefined) currentCounts[b.type]++; });

        // If we lost all our braves, have the shaman cast create to respawn one
        if (myBraves.length === 0 && this.myShaman && this.myShaman.state !== 'dead') {
             // Only attempt if spell is off a reasonable internal cooldown
             if (state.clock.getElapsedTime() - this.lastSpellTime > 5.0) {
                 executeSpell('create', this.myShaman.mesh.position.x, this.myShaman.mesh.position.z, this.myShaman);
                 this.lastSpellTime = state.clock.getElapsedTime();
             }
        }

        // Decide if we should train something. If we have a brave and a building.
        const idleBraves = myBraves.filter(u => u.state === 'idle');
        // Train as many units as we can, keeping at least 2 builders available
        let bravesToTrain = idleBraves.slice(2);

        // Only start training once all training buildings are built
        const hasAllTrainingBuildings = currentCounts.warrior > 0 && currentCounts.fire > 0 && currentCounts.spy > 0 && currentCounts.shipyard > 0;

        if (hasAllTrainingBuildings && bravesToTrain.length > 0 && trainingBuildings.length > 0) {
            bravesToTrain.forEach(brave => {
                let targetBuildingType = 'warrior'; // fallback

                // Prioritize replacing lost units
                if (this.lossQueue.length > 0) {
                    const lostType = this.lossQueue.shift();
                    if (lostType === 'warrior') targetBuildingType = 'warrior';
                    else if (lostType === 'firewarrior') targetBuildingType = 'fire';
                    else if (lostType === 'spy') targetBuildingType = 'spy';
                    else if (lostType === 'airship') targetBuildingType = 'shipyard';
                } else {
                    // Keep an even mix of units
                    if (unitCounts.warrior >= unitCounts.firewarrior + 2 && myBuildings.some(b => b.type === 'fire')) {
                        targetBuildingType = 'fire';
                    } else if (unitCounts.firewarrior >= unitCounts.spy + 1 && myBuildings.some(b => b.type === 'spy')) {
                        targetBuildingType = 'spy';
                    } else if (unitCounts.spy >= unitCounts.airship + 1 && myBuildings.some(b => b.type === 'shipyard')) {
                        targetBuildingType = 'shipyard';
                    } else {
                        // Randomly choose from available training buildings to keep it varied
                        const availableTypes = [...new Set(trainingBuildings.map(b => b.type))];
                        targetBuildingType = availableTypes[Math.floor(Math.random() * availableTypes.length)];
                    }
                }

                const targetBuilding = trainingBuildings.find(b => b.type === targetBuildingType);
                if (targetBuilding) {
                    brave.goto(targetBuilding.mesh.position.x, targetBuilding.mesh.position.z);
                    // Also manually tell it to 'train' state or similar if needed,
                    // but just moving it near the building will trigger the collision check in Humanoid.update
                } else {
                    // If the building was destroyed, push the loss back to the queue
                    if (this.lossQueue.length > 0) {
                       // Try to infer what we lost (approximation)
                       this.lossQueue.push('warrior');
                    }
                }
            });
        }


        // 2. Expand Base
        // Aggressive expansion: always try if we have at least one building and one brave (busy or idle)
        const buildingLimit = 15 + this.targetHutCount;
        if (myBuildings.length < buildingLimit && myBraves.length > 0) {
            // Determine which building to build next
            const targetCounts = { hut: this.targetHutCount, tower: 5, warrior: 2, fire: 2, spy: 2, shipyard: 1 };

            let typeToBuild = null;

            // Core initial phase: ensure we have at least enough huts to support our base and losses
            if (currentCounts.hut < this.targetHutCount) typeToBuild = 'hut';
            // Then ensure we have at least 1 of everything critical
            else if (currentCounts.warrior < 1) typeToBuild = 'warrior';
            else if (currentCounts.fire < 1) typeToBuild = 'fire';
            else if (currentCounts.spy < 1) typeToBuild = 'spy';
            else if (currentCounts.shipyard < 1) typeToBuild = 'shipyard';
            // Then continue expanding up to targets
            else if (currentCounts.hut < targetCounts.hut) typeToBuild = 'hut';
            else if (currentCounts.warrior < targetCounts.warrior) typeToBuild = 'warrior';
            else if (currentCounts.fire < targetCounts.fire) typeToBuild = 'fire';
            else if (currentCounts.spy < targetCounts.spy) typeToBuild = 'spy';
            else if (currentCounts.shipyard < targetCounts.shipyard) typeToBuild = 'shipyard';
            else if (currentCounts.tower < targetCounts.tower) typeToBuild = 'tower';
            // If we have met the target counts, start building more
            else {
                const extraTypes = ['hut', 'tower', 'warrior', 'fire'];
                typeToBuild = extraTypes[Math.floor(Math.random() * extraTypes.length)];
            }

            if (typeToBuild) {
                // Try up to 10 times to find a spot per think cycle
                for(let attempt=0; attempt<10; attempt++) {
                    // Pick a brave as reference to satisfy "build only near brave"
                    const ref = myBraves[Math.floor(Math.random() * myBraves.length)];
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 2 + Math.random() * 6; // Closer range (2-8) to ensure brave is "nearby" (within 10)
                    let tx = ref.mesh.position.x + Math.cos(angle) * dist;
                    let tz = ref.mesh.position.z + Math.sin(angle) * dist;

                    // Snap to land (function is hoisted and available)
                    const safe = findNearestLand(tx, tz, 20);
                    tx = safe.x; tz = safe.z;

                    // Check land validity again (just in case)
                    if (getHeight(tx, tz) >= WATER_LEVEL) {
                        // Check spacing
                        let clear = true;
                        for (let b of state.buildings) {
                            if (!b.dead && b.mesh.position.distanceTo(new THREE.Vector3(tx, b.mesh.position.y, tz)) < 6.0) {
                                clear = false; break;
                            }
                        }
                        if (clear) {
                            createBuilding(typeToBuild, tx, tz, 1);
                            break; // Built one, stop trying this frame
                        }
                    }
                }
            }
        }

        // 4. Random Movement for Expansion (Braves)
        const myIdleBraves = myUnits.filter(u => u.type === 'wild');
        myIdleBraves.forEach(u => {
            if(u.state === 'idle' && Math.random() < 0.5) { // 50% chance to move if idle
                 const dist = 10 + Math.random() * 20;
                 const angle = Math.random() * Math.PI * 2;
                 const tx = u.mesh.position.x + Math.cos(angle) * dist;
                 const tz = u.mesh.position.z + Math.sin(angle) * dist;
                 const safe = findNearestLand(tx, tz, 20);
                 u.goto(safe.x, safe.z);
            }
        });

        // 3. Attack Player
        if(myUnits.length > 5) {
            // Send some to attack enemy shaman
            const attackers = myUnits.filter(u => u.type !== 'wild' && u.state === 'idle');
            // Find an enemy shaman
            const target = state.units.find(u => u.isShaman && !window.isAllied(u.faction, this.faction) && u.state !== 'dead');
            if(target) {
                attackers.forEach(u => {
                    u.goto(target.mesh.position.x, target.mesh.position.z);
                    u.attackTarget = target;
                    u.state = 'combat'; // Force combat state approach
                });
            }
        }

        // 4. Shaman Logic (Spells & Move)
        const myShaman = myUnits.find(u => u.isShaman);
        const target = state.units.find(u => u.isShaman && !window.isAllied(u.faction, this.faction) && u.state !== 'dead');
        if(myShaman && target) {
            const dist = myShaman.mesh.position.distanceTo(target.mesh.position);

            // Offensive Spells
            const spellRange = 10.0 + myShaman.mesh.position.y;
            if (state.clock.getElapsedTime() - this.lastSpellTime > 5.0) {
                if (dist < spellRange) {
                    const offensiveSpells = ['blast', 'lightning', 'tornado', 'swarm', 'firestorm'];
                    const spell = offensiveSpells[Math.floor(Math.random() * offensiveSpells.length)];
                    executeSpell(spell, target.mesh.position.x, target.mesh.position.z, myShaman);
                    this.lastSpellTime = state.clock.getElapsedTime();
                }
            }

            // Move shaman to attack if idle
            // Check cooldown
            if (state.clock.getElapsedTime() - this.lastBridgeTime > 2.0) {
                // Check if path already exists
                if (!Pathfinder.findPath(myShaman.mesh.position, target.mesh.position, false, myShaman.height)) {
                    // Check for water in path
                    const steps = 10;
                    const dir = target.mesh.position.clone().sub(myShaman.mesh.position).normalize();

                    for(let i=1; i<=steps; i++) {
                        const checkPos = myShaman.mesh.position.clone().addScaledVector(dir, i * 4.0); // Check ahead 40 units
                        if (getHeight(checkPos.x, checkPos.z) < WATER_LEVEL) {
                            // Raise land
                            executeSpell('raise', checkPos.x, checkPos.z, myShaman);
                            this.lastBridgeTime = state.clock.getElapsedTime();
                            break;
                        }
                    }
                }
            }

            // Also move shaman to attack if idle
            if (myShaman.state === 'idle' && dist > 20) {
                 myShaman.goto(target.mesh.position.x, target.mesh.position.z);
            }
        }
    }
}

function performAction(x, z, action = state.currentAction, overrideUnits = null) {
    const actingUnits = overrideUnits || state.selectedUnits;

    if(state.network.role === 'client') {
        const unitIds = actingUnits.map(u => u.id);
        NetworkManager.sendInput({x, z, action, unitIds});
        spawnPulse(x, getHeight(x, z), z, 0x888888);
        return;
    }

    if(action === 'move') {
        if(actingUnits.length > 0) {
            actingUnits.forEach(u => {
                u.goto(x, z);
                u.attackTarget = null;
            });
            spawnPulse(x, getHeight(x, z), z, 0xFFFFFF);
        }
        return;
    }

    // Prevent building on water
    if (action.startsWith('build_') && getHeight(x, z) < WATER_LEVEL) return;

    // Prevent building if no brave nearby
    if (action.startsWith('build_') && !isBraveNearby(0, x, z, 10)) return;

    const spells = ['blast', 'lightning', 'raise', 'lower', 'flatten', 'landbridge', 'swamp', 'invisibility', 'shield', 'hypnotise', 'swarm', 'tornado', 'firestorm', 'volcano', 'heal', 'teleport', 'create'];

    // Range Check for Spells
    let caster = state.shaman;
    const isSpyCast = (action === 'hypnotise' && actingUnits.length === 1 && actingUnits[0].type === 'spy');
    if (isSpyCast) {
        caster = actingUnits[0];
    }

    if (spells.includes(action)) {
        if (!isSpyCast && (!state.shaman || state.shaman.state === 'dead')) return;

        if (!state.cheatUnlimitedRange) {
            let maxRange = 10.0 + caster.mesh.position.y;
            if (isSpyCast) maxRange = 5.0; // Very small range for Spy
            const dist = Math.sqrt((x - caster.mesh.position.x)**2 + (z - caster.mesh.position.z)**2);
            if (dist > maxRange) return;
        }
    }

    const costs = {
        blast: 10, lightning: 50, raise: 5, lower: 5, flatten: 10, landbridge: 20,
        swamp: 15, invisibility: 20, shield: 20, hypnotise: 50, swarm: 20, tornado: 60, firestorm: 80, volcano: 90, heal: 10, teleport: 90, create: 50,
        build_hut: BUILDING_COSTS.hut, build_tower: BUILDING_COSTS.tower, build_warrior: BUILDING_COSTS.warrior,
        build_fire: BUILDING_COSTS.fire, build_spy: BUILDING_COSTS.spy, build_shipyard: BUILDING_COSTS.shipyard, build_airship: 25
    };
    const cost = costs[action];
    if (cost === undefined || isNaN(cost)) return;
    if (state.mana < cost) return;
    state.mana -= cost;
    updateUI();

    if (spells.includes(action)) {
        executeSpell(action, x, z, caster);
    }
    else if (action === 'build_airship') {
        // Build Airship
        // Find nearest shipyard
        let nearest = null; let minD = 50;
        state.buildings.forEach(b => {
            if(b.type === 'shipyard' && b.faction === 0 && !b.underConstruction) {
                const d = Math.sqrt((b.mesh.position.x - x)**2 + (b.mesh.position.z - z)**2);
                if(d < minD) { minD = d; nearest = b; }
            }
        });

        if(nearest) {
             const safe = findNearestLand(x, z);
             const h = getHeight(safe.x, safe.z);
             const airship = new Humanoid(0, 'airship', safe.x, safe.z);
             // Airship height override
             airship.mesh.position.y = Math.max(h, 10);
             state.units.push(airship);
             spawnPulse(x, h, z, 0xFFFFFF);
             SoundManager.playSound('construct');
        } else {
             // No shipyard nearby
        }
    }
    else if (action === 'unload') {
        if(actingUnits.length === 1 && actingUnits[0].type === 'airship') {
            actingUnits[0].unload();
        }
    }
    else if (action.startsWith('build_')) {
        const type = action.replace('build_', '');
        createBuilding(type, x, z);
    }
}

function setupKeyboard() {
    const keys = { w: false, a: false, s: false, d: false };
    const update = () => {
        state.keyboardVector.set(0, 0);
        if(keys.w) state.keyboardVector.y -= 1;
        if(keys.s) state.keyboardVector.y += 1;
        if(keys.a) state.keyboardVector.x -= 1;
        if(keys.d) state.keyboardVector.x += 1;
    };
    window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if(keys.hasOwnProperty(k)) { keys[k] = true; update(); }
    });
    window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if(keys.hasOwnProperty(k)) { keys[k] = false; update(); }
    });
}

function setupJoystick() {
    const area = document.getElementById('joystick-area');
    const knob = document.getElementById('joystick-knob');
    let startX = 0, startY = 0;
    let active = false;

    const handleStart = (x, y) => {
        active = true;
        startX = x; startY = y;
        knob.style.transition = 'none';
    };

    const handleMove = (x, y) => {
        if(!active) return;
        const maxDist = 50;
        let dx = x - startX;
        let dy = y - startY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist > maxDist) {
            dx = (dx / dist) * maxDist;
            dy = (dy / dist) * maxDist;
        }
        knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        state.joystickVector.set(dx / maxDist, dy / maxDist);
    };

    const handleEnd = () => {
        active = false;
        knob.style.transition = 'transform 0.2s';
        knob.style.transform = `translate(-50%, -50%)`;
        state.joystickVector.set(0, 0);
    };

    area.addEventListener('touchstart', e => {
        e.preventDefault();
        if(e.targetTouches.length > 0) handleStart(e.targetTouches[0].clientX, e.targetTouches[0].clientY);
    }, {passive:false});
    area.addEventListener('touchmove', e => {
        e.preventDefault();
        if(e.targetTouches.length > 0) handleMove(e.targetTouches[0].clientX, e.targetTouches[0].clientY);
    }, {passive:false});
    area.addEventListener('touchend', e => { e.preventDefault(); handleEnd(); });

    area.addEventListener('mousedown', e => { handleStart(e.clientX, e.clientY); });
    window.addEventListener('mousemove', e => { if(active) handleMove(e.clientX, e.clientY); });
    window.addEventListener('mouseup', e => { if(active) handleEnd(); });
}

window.applyLandGen = function() {
    const noiseVal = parseFloat(document.getElementById('noise-scale-input').value);
    const heightVal = parseFloat(document.getElementById('height-mult-input').value);
    const waterVal = parseFloat(document.getElementById('water-level-input').value);
    const bridgeHeightVal = parseFloat(document.getElementById('bridge-height-input').value);
    const bridgeWidthVal = parseFloat(document.getElementById('bridge-width-input').value);

    if(!isNaN(noiseVal) && noiseVal > 0) {
        NOISE_SCALE = noiseVal;
        if(!isNaN(heightVal)) HEIGHT_MULTIPLIER = heightVal;
        if(!isNaN(waterVal)) {
            WATER_LEVEL = waterVal;
            VISUAL_WATER_LEVEL = waterVal / 4;
            // Find existing visual water mesh and update its Y pos
            if (state.scene) {
                state.scene.traverse(c => {
                    if(c.material === AssetCache.mats.water) {
                        c.position.y = VISUAL_WATER_LEVEL;
                    }
                });
            }
        }
        if(!isNaN(bridgeHeightVal)) BRIDGE_HEIGHT = bridgeHeightVal;
        if(!isNaN(bridgeWidthVal)) BRIDGE_WIDTH = bridgeWidthVal;

        // Regenerate world visually
        state.terrainMods.clear();

        // Remove existing chunk meshes
        for(let key in state.chunks) {
            if(state.chunks[key].mesh) state.scene.remove(state.chunks[key].mesh);
        }
        state.chunks = {};

        // Clean any pathfinding references if they were caching
        // Pathfinder doesn't have a persistent cache object right now, so nothing to clear

        updateChunks(true);
    }
    closeLandGenMenu();
};
