<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Populate the Rebeginning</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        #top-bar { padding: 10px; text-align: center; text-shadow: 1px 1px 2px black; pointer-events: auto; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);}
        p { margin: 5px 0 0; font-size: 12px; color: white; }

        #mana-bar {
            width: 200px; height: 10px; background: #333; margin: 0 auto; border: 1px solid white; border-radius: 5px; overflow: hidden;
        }
        #mana-fill { width: 100%; height: 100%; background: #00BFFF; transition: width 0.2s; }

        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; color: #FFD700; display: flex; align-items: center; justify-content: center;
            z-index: 100; font-size: 24px; font-weight: bold;
        }

        /* UNIT LIST - Left side, above joystick */
        #unit-list {
            position: absolute;
            top: 70px;
            left: 0;
            width: 48px;
            bottom: 220px; /* Space for joystick */
            overflow-y: auto;
            overflow-x: hidden;
            background: rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 2px;
            pointer-events: auto;
            z-index: 10;
            touch-action: pan-y;
        }
        #unit-list::-webkit-scrollbar { width: 3px; }
        #unit-list::-webkit-scrollbar-track { background: transparent; }
        #unit-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 1px; }

        #enemy-spell-queue {
            position: absolute;
            top: 70px;
            left: 55px;
            width: 30px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 10;
            pointer-events: none;
        }

        .enemy-spell-item {
            width: 30px;
            height: 30px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            border-radius: 5px;
            border: 2px solid #FF0000;
            flex-shrink: 0;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        .unit-item {
            width: 29px;
            height: 29px;
            background: #333;
            border: 1px solid #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .unit-item:active { transform: scale(0.9); }
        .unit-item.selected { border-color: #00FF00; box-shadow: 0 0 10px #00FF00; background: #444; }
        .unit-item.enemy { border-color: #FF0000; }
        .unit-item.enemy.selected { border-color: #FF4500; box-shadow: 0 0 10px #FF4500; }

        .hp-indicator {
            position: absolute;
            bottom: 2px; left: 10%; width: 80%; height: 2px; background: #555;
        }
        .hp-val { height: 100%; background: #00FF00; width: 100%; }
        .unit-item.enemy .hp-val { background: #FF0000; }

        /* RIGHT ACTION MENU */
        #right-menu {
            position: absolute;
            top: 60px;
            right: 10px;
            width: 80px;
            bottom: 20px;
            overflow-y: auto;
            overflow-x: hidden;
            pointer-events: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 5px;
            justify-items: center;
            /* background: linear-gradient(to left, rgba(0,0,0,0.5), transparent); */
        }
        #right-menu::-webkit-scrollbar { width: 0; } /* Hide scrollbar */

        .action-btn {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 2px solid #555;
            background: #222;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 3px rgba(0,0,0,0.5);
            position: relative;
            flex-shrink: 0;
        }
        .action-btn.active { border-color: #FFD700; transform: scale(1.1); box-shadow: 0 0 10px #FFD700; background: #444; z-index: 5; }
        .action-btn:active { transform: scale(0.95); }
        .label {
            font-size: 9px; position: absolute; bottom: -12px; width: 160%; left: -30%;
            text-align: center; text-shadow: 1px 1px 1px black; color: #ddd;
            background: rgba(0,0,0,0.5); border-radius: 4px; padding: 0;
            pointer-events: none;
        }

        /* JOYSTICK */
        #joystick-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-bg {
            position: absolute;
            top: 50%; left: 50%;
            width: 120px; height: 120px;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        #joystick-knob {
            position: absolute;
            top: 50%; left: 50%;
            width: 50px; height: 50px;
            transform: translate(-50%, -50%);
            background: rgba(255, 215, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .multi-select-btn {
            position: absolute;
            bottom: 180px; left: 20px;
            width: 40px; height: 40px;
            background: #444; border: 2px solid #888;
            color: white; font-size: 20px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto;
            cursor: pointer;
        }
        .multi-select-btn.active { border-color: #00FF00; color: #00FF00; box-shadow: 0 0 5px #00FF00; }

        .unload-btn {
            position: absolute; bottom: 20px; right: 90px;
            width: 50px; height: 50px;
            background: #444; border: 2px solid white;
            color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; pointer-events: auto; cursor: pointer;
            z-index: 50; display: none;
        }

        #btn-pause {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px; height: 40px;
            background: transparent;
            color: white;
            border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 100;
        }
        #btn-pause:active { transform: scale(0.9); }

        .menu-btn {
            background: #444; color: white; border: 2px solid white;
            padding: 5px 10px; font-size: 14px; margin: 5px;
            cursor: pointer; width: 150px; border-radius: 5px;
        }
        .menu-btn:hover { background: #666; }
        .menu-btn:active { background: #222; }

    </style>
</head>
<body>

<div id="ui-layer">

    <div id="pause-menu" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); flex-direction:column; align-items:center; justify-content:center; z-index:200; pointer-events:auto;">

        <div style="margin-bottom:20px; display:flex; gap:10px; align-items:center;">
            <label style="width:120px;">Bridge Width: </label>

        <button class="menu-btn" onclick="applyLandGen()">Apply & Regenerate</button>

    <div id="multiplayer-menu" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); flex-direction:column; align-items:center; justify-content:center; z-index:201; color:white; pointer-events:auto;">
        <h1 style="color:white; margin-bottom:20px; text-shadow: 2px 2px 0 #000;">MULTIPLAYER</h1>

        <div id="mp-lobby" style="display:flex; flex-direction:column; align-items:center; gap:10px;">
            <button class="menu-btn" onclick="startHost()">Host Game</button>
            <div style="display:flex; gap:10px; align-items:center;">
                <input type="text" id="join-id" placeholder="Enter Game ID" style="padding:10px; font-size:16px;">
                <button class="menu-btn" style="width:auto;" onclick="joinGame()">Join</button>
            </div>
            <div id="mp-status" style="min-height:20px; color:#00FF00; margin:10px; text-align:center;"></div>
            <div id="mp-id-display" style="font-size:20px; font-weight:bold; color:gold; display:none;">

    <div id="unit-list"></div>

        <div id="mana-bar"><div id="mana-fill"></div></div>
        <p>Mana: <span id="mana-text">100</span></p>

    <div id="right-menu">

    <!-- Joystick Left -->

        <div id="joystick-knob"></div>
    </div>

    <div id="btn-multiselect" class="multi-select-btn" onclick="toggleMultiSelect()">⊕</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

// --- js/constants.js ---
const CHUNK_SIZE = 40;
const CHUNK_RES = 80;
const RENDER_DISTANCE = 5;
let NOISE_SCALE = 0.02;
let HEIGHT_MULTIPLIER = 1.0;
let BRIDGE_HEIGHT = 3.0;
let BRIDGE_WIDTH = 2.5;
const MIN_ZOOM = 3;
const MAX_ZOOM = 70;

let WATER_LEVEL = 1.805;
let VISUAL_WATER_LEVEL = 0.45125;

const COLORS = {
    water: 0x1E90FF, sand: 0xEEDC82, grass: 0x228B22, rock: 0x696969, snow: 0xFFFFFF,
    lava: 0xCF1020, skin: 0xD2B48C, shirt_wild: 0x8B4513, shirt_shaman: 0xFF4500,
    wood: 0x8B4513, straw: 0xDAA520, stone: 0x808080, red: 0x8B0000, yellow: 0xFFD700, blue: 0x4169E1
};

const BUILDING_COSTS = { hut: 15, tower: 20, warrior: 30, fire: 40, spy: 40, shipyard: 50 };

const FACTION_COLORS = [
    0x4169E1, // 0: Player (Blue)
    0xFF4500, // 1: Enemy 1 (Red)
    0x228B22, // 2: Enemy 2 (Green)
    0xFFD700, // 3: Enemy 3 (Yellow)
    0x800080, // 4: Enemy 4 (Purple)
    0xFF69B4, // 5: Enemy 5 (Pink)
    0x00CED1, // 6: Enemy 6 (Cyan)
    0xFF8C00, // 7: Enemy 7 (Orange)
];

function getFactionColor(faction) {
    return FACTION_COLORS[faction % FACTION_COLORS.length];
}

function getFactionMaterial(faction) {
    if (!AssetCache.mats.factionMats) AssetCache.mats.factionMats = {};
    if (!AssetCache.mats.factionMats[faction]) {
        AssetCache.mats.factionMats[faction] = new THREE.MeshStandardMaterial({color: getFactionColor(faction), roughness: 0.7, metalness: 0.1});
    }
    return AssetCache.mats.factionMats[faction];
}

function getHpMaterial(faction) {
    if (!AssetCache.mats.hpMats) AssetCache.mats.hpMats = {};
    if (!AssetCache.mats.hpMats[faction]) {
        const color = faction === 0 ? 0x00FF00 : (faction === 1 ? 0xFF0000 : getFactionColor(faction));
        AssetCache.mats.hpMats[faction] = new THREE.MeshBasicMaterial({color: color});
    }
    return AssetCache.mats.hpMats[faction];
}

window.isAllied = function(f1, f2) {
    const t1 = state.teams && state.teams[f1] !== undefined ? state.teams[f1] : f1;
    const t2 = state.teams && state.teams[f2] !== undefined ? state.teams[f2] : f2;
    return t1 === t2;
};

const ACTIONS = {
    'move': { icon: '👣', label: 'Walk', cost: 0 },
    'blast': { icon: '🔥', label: 'Blast', cost: 10 },
    'lightning': { icon: '⚡', label: 'Lght', cost: 50 },
    'raise': { icon: '▲', label: 'Rais', cost: 5 },
    'lower': { icon: '▼', label: 'Lowr', cost: 5 },
    'flatten': { icon: '➖', label: 'Flat', cost: 10 },
    'landbridge': { icon: '🌉', label: 'Bridg', cost: 20 },
    'swamp': { icon: '🌫️', label: 'Swmp', cost: 15 },
    'invisibility': { icon: '👻', label: 'Invis', cost: 20 },
    'shield': { icon: '🛡️', label: 'Shld', cost: 20 },
    'hypnotise': { icon: '🌀', label: 'Conv', cost: 50 },
    'swarm': { icon: '🐝', label: 'Swrm', cost: 40 },
    'tornado': { icon: '🌪️', label: 'Torn', cost: 60 },
    'firestorm': { icon: '☄️', label: 'Fire', cost: 80 },
    'volcano': { icon: '🌋', label: 'Volc', cost: 90 },
    'heal': { icon: '💖', label: 'Heal', cost: 10 },
    'teleport': { icon: '🌌', label: 'Tele', cost: 90 },
    'create': { icon: '👶', label: 'Spwn', cost: 50 },
    'build_hut': { icon: '🏠', label: 'Hut', cost: 15 },
    'build_tower': { icon: '🗼', label: 'Towr', cost: 20 },
    'build_warrior': { icon: '⚔️', label: 'War', cost: 30 },
    'build_fire': { icon: '🔥', label: 'Fire', cost: 40 },
    'build_spy': { icon: '🌙', label: 'Spy', cost: 40 },
    'build_shipyard': { icon: '⚓', label: 'Dock', cost: 50 },
    'build_airship': { icon: '🎈', label: 'Ship', cost: 25 }
};

const UNIT_ICONS = {
    'wild': '👷',
    'warrior': '⚔️',
    'firewarrior': '🔥',
    'shaman': '🧙',
    'spy': '🕵️',
    'airship': '💨'
};


// --- js/state.js ---

const state = {
    scene: null,
    camera: null,
    renderer: null,
    raycaster: null,
    orthoCamera: null,
    perspectiveCamera: null,
    isFPV: false,
    fpvYaw: 0,
    fpvPitch: 0,
    clock: null,
    simplex: null,
    
    // Game State
    chunks: {},
    terrainMods: new Map(),
    units: [],

    particles: [],
    projectiles: [],
    buildings: [],
    activeEffects: [],

    shaman: null,
    rangeRing: null,
    selectedUnits: [],
    cameraLookAt: null,
    viewScale: 35,
    currentAction: 'select',
    mana: 100,

    isDragging: false,
    dragStart: { x: 0, y: 0 },
    tapStart: { x: 0, y: 0 },
    dragButton: 0,
    pinchStartDist: 0,
    pinchStartScale: 35,
    pinchStartAngle: 0,
    rotateStartCamera: 0,
    cameraRotation: Math.PI / 4,
    multiSelectMode: false,
    joystickVector: new THREE.Vector2(0, 0),
    keyboardVector: new THREE.Vector2(0, 0),
    isPaused: false,

    // Cheats
    cheatUnlimitedRange: false,
    isGodMode: false,

    // Network
    teams: {}, network: {
        peer: null,
        conn: null,
        role: 'none', // 'host', 'client', 'none'
        id: null
    }
};

// SpatialHash
const SpatialHash = {
    cellSize: 20,
    cells: new Map(),
    update: function() {
        for (let cell of this.cells.values()) {
            cell.length = 0;
        }
        for(let i=0; i<state.units.length; i++) {
            const u = state.units[i];
            if(u.state !== 'dead') {
                const cx = Math.floor(u.mesh.position.x / this.cellSize);
                const cz = Math.floor(u.mesh.position.z / this.cellSize);
                const key = (cx << 16) | (cz & 0xFFFF);
                let cell = this.cells.get(key);
                if (!cell) {
                    cell = [];
                    this.cells.set(key, cell);
                }
                cell.push(u);
            }
        }
    },
    query: function(x, z, radius) {
        const results = [];
        const cx = Math.floor(x / this.cellSize);
        const cz = Math.floor(z / this.cellSize);
        const r = Math.ceil(radius / this.cellSize);
        for(let i = cx - r; i <= cx + r; i++) {
            for(let j = cz - r; j <= cz + r; j++) {
                const key = (i << 16) | (j & 0xFFFF);
                const cellUnits = this.cells.get(key);
                if (cellUnits) {
                    for(let k=0; k<cellUnits.length; k++) {
                         results.push(cellUnits[k]);
                    }
                }
            }
        }
        return results;
    }
};

// Building SpatialHash for optimized isBlocked queries
const BuildingSpatialHash = {
    cellSize: 20,
    cells: new Map(),
    dirty: true,

    markDirty: function() { this.dirty = true; },

    update: function() {
        if (!this.dirty) return;
        this.dirty = false;

        for (let cell of this.cells.values()) {
            cell.length = 0;
        }
        for(let b of state.buildings) {
             if(!b.dead && !b.underConstruction) {
                this.add(b);
             }
        }
    },

    add: function(b) {
        const r = 2.0;
        const minX = Math.floor((b.mesh.position.x - r) / this.cellSize);
        const maxX = Math.floor((b.mesh.position.x + r) / this.cellSize);
        const minZ = Math.floor((b.mesh.position.z - r) / this.cellSize);
        const maxZ = Math.floor((b.mesh.position.z + r) / this.cellSize);

        for(let x = minX; x <= maxX; x++) {
            for(let z = minZ; z <= maxZ; z++) {
                const key = (x << 16) | (z & 0xFFFF);
                let cell = this.cells.get(key);
                if (!cell) {
                    cell = [];
                    this.cells.set(key, cell);
                }
                cell.push(b);
            }
        }
    },

    query: function(x, z) {
         const cx = Math.floor(x / this.cellSize);
         const cz = Math.floor(z / this.cellSize);
         const key = (cx << 16) | (cz & 0xFFFF);
         return this.cells.get(key);
    }
};

// Expose to window for compatibility and debug
window.chunks = state.chunks;
window.terrainMods = state.terrainMods;
window.units = state.units;
window.buildings = state.buildings;

// --- js/network.js ---
const NetworkManager = {
    startHost: function() {
        if(state.network.peer) return;
        state.network.role = 'host';
        state.network.peer = new Peer(generateUUID().substr(0, 5), {
             debug: 2
        });

        state.network.peer.on('open', (id) => {
            state.network.id = id;
            const el = document.getElementById('my-game-id');
            if(el) el.innerText = id;
            document.getElementById('mp-id-display').style.display = 'block';
            document.getElementById('mp-status').innerText = "Waiting for player...";
        });

        state.network.peer.on('connection', (conn) => {
             if(state.network.conn) {
                 conn.close();
                 return;
             }
             state.network.conn = conn;
             document.getElementById('mp-status').innerText = "Player Connected!";

             conn.on('data', (data) => {
                 this.handleData(data);
             });

             conn.on('close', () => {
                 state.network.conn = null;
                 document.getElementById('mp-status').innerText = "Player Disconnected.";
             });
        });
    },

    joinGame: function(hostId) {
        if(state.network.peer) return;
        state.network.role = 'client';
        state.network.peer = new Peer(generateUUID().substr(0, 5));

        state.network.peer.on('open', (id) => {
             state.network.id = id;
             const conn = state.network.peer.connect(hostId);

             conn.on('open', () => {
                 state.network.conn = conn;
                 document.getElementById('mp-status').innerText = "Connected to Host!";
                 document.getElementById('mp-lobby').style.display = 'none';
                 togglePause(); // Unpause locally
                 state.isPaused = false;
                 document.getElementById('pause-menu').style.display = 'none';
                 document.getElementById('multiplayer-menu').style.display = 'none';
             });

             conn.on('data', (data) => {
                 this.handleData(data);
             });

             conn.on('close', () => {
                  alert("Disconnected from Host");
                  location.reload();
             });
        });

        state.network.peer.on('error', (err) => {
             document.getElementById('mp-status').innerText = "Error: " + err.type;
        });
    },

    sendFullState: function() {
        if(!state.network.conn) return;
        const data = {
            type: 'sync',
            units: state.units.map(u => ({
                id: u.id,
                type: u.type,
                faction: u.faction,
                x: u.mesh.position.x,
                y: u.mesh.position.y,
                z: u.mesh.position.z,
                rot: u.mesh.rotation.y,
                hp: u.hp,
                state: u.state,
                animTime: u.animTime
            })),
            buildings: state.buildings.map(b => ({
                id: b.id,
                type: b.type,
                faction: b.faction,
                x: b.mesh.position.x,
                z: b.mesh.position.z,
                hp: b.hp,
                underConstruction: b.underConstruction,
                constructionTimer: b.constructionTimer
            }))
        };
        state.network.conn.send(data);
    },

    sendInput: function(inputData) {
        if(state.network.conn) {
            state.network.conn.send({
                type: 'input',
                data: inputData
            });
        }
    },

    handleData: function(data) {
        if(state.network.role === 'host') {
             if(data.type === 'input') {
                 const d = data.data;
                 let units = null;
                 if(d.unitIds) {
                     units = state.units.filter(u => d.unitIds.includes(u.id));
                 }
                 performAction(d.x, d.z, d.action, units);
             }
        } else {
             if(data.type === 'sync') {
                 this.applySync(data);
             }
        }
    },

    applySync: function(data) {
        const unitIds = new Set(data.units.map(u => u.id));

        data.units.forEach(uData => {
             let u = state.units.find(unit => unit.id === uData.id);
             if(!u) {
                 u = new Humanoid(uData.faction, uData.type, uData.x, uData.z, uData.id);
                 state.units.push(u);
             }

             u.mesh.position.set(uData.x, uData.y, uData.z);
             u.mesh.rotation.y = uData.rot;
             u.hp = uData.hp;
             if(u.hpBar) u.hpBar.scale.x = Math.max(0, u.hp / u.maxHp);
             u.state = uData.state;
             u.animTime = uData.animTime;
        });

        for(let i = state.units.length-1; i>=0; i--) {
            if(!unitIds.has(state.units[i].id)) {
                 state.scene.remove(state.units[i].mesh);
                 state.units.splice(i, 1);
            }
        }

        const buildIds = new Set(data.buildings.map(b => b.id));
        data.buildings.forEach(bData => {
            let b = state.buildings.find(build => build.id === bData.id);
            if(!b) {
                b = createBuilding(bData.type, bData.x, bData.z, bData.faction, false, true, bData.id);
            }
            if(b) {
                b.hp = bData.hp;
                b.underConstruction = bData.underConstruction;
                b.constructionTimer = bData.constructionTimer;
                if(b.hpBar) b.hpBar.scale.x = Math.max(0, b.hp / b.maxHp);
                if(b.underConstruction) {
                     const progress = 1.0 - (b.constructionTimer / 5.0);
                     b.visualMesh.scale.y = Math.max(0.01, progress);
                } else {
                     b.visualMesh.scale.y = 1.0;
                }
            }
        });

        for(let i = state.buildings.length-1; i>=0; i--) {
            if(!buildIds.has(state.buildings[i].id)) {
                 state.scene.remove(state.buildings[i].mesh);
                 state.buildings.splice(i, 1);
            }
        }
    }
};

const SoundManager = {
    ctx: null,
    init: function() {
        if (this.ctx) return;
        try {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            if(window.AudioContext) {
                this.ctx = new AudioContext();
            } else {
                console.warn("WebAudio not supported");
            }
        } catch(e) {
            console.warn("AudioContext creation failed:", e);
        }
    },
    playTone: function(freq, type, duration, vol=0.1) {
        if(!this.ctx) this.init();
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    playNoise: function(duration, vol=0.1) {
        if(!this.ctx) this.init();
        if(!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        noise.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
    },
    playSound: function(name) {
        if(!this.ctx) this.init();
        if(!this.ctx) return;
        if(this.ctx.state === 'suspended') this.ctx.resume();

        switch(name) {
            case 'attack':
                this.playNoise(0.1, 0.2);
                this.playTone(150, 'square', 0.1, 0.1);
                break;
            case 'fireball':
                this.playTone(400, 'sine', 0.3, 0.1);
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
                break;
            case 'explosion':
                this.playNoise(0.5, 0.5);
                this.playTone(50, 'sawtooth', 0.5, 0.3);
                break;
            case 'magic':
                this.playTone(800, 'sine', 0.5, 0.1);
                this.playTone(1200, 'sine', 0.5, 0.05);
                break;
            case 'construct':
                 this.playTone(200, 'square', 0.1, 0.1);
                 setTimeout(()=>this.playTone(200, 'square', 0.1, 0.1), 200);
                 break;
            case 'rumble':
                this.playTone(80, 'sawtooth', 0.5, 0.2);
                break;
        }
    }
};

function addWindShader(material) {
    material.onBeforeCompile = function(shader) {
        shader.uniforms.uTime = window.flowerUniforms.uTime;
        shader.vertexShader = `
            attribute vec3 aBasePos;
            uniform float uTime;
            ${shader.vertexShader}
        `.replace(
            `#include <project_vertex>`,
            `
            vec4 mvPosition = vec4( transformed, 1.0 );
            #ifdef USE_INSTANCING
                mvPosition = instanceMatrix * mvPosition;
                float heightFromBase = max(0.0, mvPosition.y - aBasePos.y);
                float windOffset = aBasePos.x * 0.5 + aBasePos.z * 0.5;
                float windX = sin(uTime * 2.0 + windOffset) * 0.05;
                float windZ = cos(uTime * 1.5 + windOffset) * 0.05;
                mvPosition.x += heightFromBase * windZ;
                mvPosition.z -= heightFromBase * windX;
            #endif
            mvPosition = modelViewMatrix * mvPosition;
            gl_Position = projectionMatrix * mvPosition;
            `
        );
    };
}

// --- js/utils.js ---

function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });
}

function mulberry32(a) {
    return function() {
      var t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
}

function getBaseHeight(x, z) {
    if (!state.simplex) return 0;
    let y = 0;
    y += state.simplex.noise2D(x * NOISE_SCALE, z * NOISE_SCALE) * 12;
    y += state.simplex.noise2D(x * NOISE_SCALE * 2, z * NOISE_SCALE * 2) * 4;
    y += state.simplex.noise2D(x * NOISE_SCALE * 4, z * NOISE_SCALE * 4) * 1.5;
    y += state.simplex.noise2D(x * NOISE_SCALE * 8, z * NOISE_SCALE * 8) * 0.75;
    y += state.simplex.noise2D(x * NOISE_SCALE * 16, z * NOISE_SCALE * 16) * 0.375;

    y *= HEIGHT_MULTIPLIER;

    // Land bridges using ridge noise
    // A value close to 0 in noise creates a ridge when inverted.
    const bridgeNoise = Math.abs(state.simplex.noise2D(x * NOISE_SCALE * 1.5 + 100, z * NOISE_SCALE * 1.5 + 100));
    // bridgeNoise is between 0 and 1. We want a sharp peak near 0.
    const finalBridgeHeight = Math.max(0, 1.0 - bridgeNoise * BRIDGE_WIDTH) * BRIDGE_HEIGHT;
    y += finalBridgeHeight;

    // Continuous smoothing
    if (y < WATER_LEVEL) y -= (WATER_LEVEL - y) * 0.2;
    if (y > 8.0) y += (y - 8.0) * 0.5;
    return y;
}

function getTerrainMod(x, z) {
    if (state.terrainMods.size === 0) return 0;
    const x1 = Math.floor(x);
    const z1 = Math.floor(z);
    const x2 = x1 + 1;
    const z2 = z1 + 1;

    const fx = x - x1;
    const fz = z - z1;

    const v11 = state.terrainMods.get(`${x1},${z1}`) || 0;
    const v21 = state.terrainMods.get(`${x2},${z1}`) || 0;
    const v12 = state.terrainMods.get(`${x1},${z2}`) || 0;
    const v22 = state.terrainMods.get(`${x2},${z2}`) || 0;

    // Bilinear interpolation
    const i1 = v11 * (1 - fx) + v21 * fx;
    const i2 = v12 * (1 - fx) + v22 * fx;
    return i1 * (1 - fz) + i2 * fz;
}

function getHeight(x, z) {
    let h = getBaseHeight(x, z);
    h += getTerrainMod(x, z);
    return h;
}

function isBlocked(x, z) {
    const candidates = BuildingSpatialHash.query(x, z);
    if (!candidates) return false;
    for(let b of candidates) {
         const dx = x - b.mesh.position.x;
         const dz = z - b.mesh.position.z;
         if (dx*dx + dz*dz < 4.0) return true;
    }
    return false;
}

function isBraveNearby(faction, x, z, radius) {
    for(let u of state.units) {
        if(u.faction === faction && u.type === 'wild' && u.state !== 'dead') {
            const dist = Math.sqrt((u.mesh.position.x - x)**2 + (u.mesh.position.z - z)**2);
            if(dist <= radius) return true;
        }
    }
    return false;
}

function findNearestLand(x, z, maxRadius = 20) {
    if(getHeight(x, z) >= WATER_LEVEL) return {x, z};

    // Spiral search
    for(let r = 2; r <= maxRadius; r += 2) {
        const steps = Math.floor(2 * Math.PI * r / 2); // roughly 2 unit spacing
        for(let i = 0; i < steps; i++) {
            const angle = (i / steps) * Math.PI * 2;
            const nx = x + Math.cos(angle) * r;
            const nz = z + Math.sin(angle) * r;
            if(getHeight(nx, nz) >= WATER_LEVEL) return {x: nx, z: nz};
        }
    }
    return {x, z}; // Fallback
}

class Particle {
    constructor(pos, color, size, life, gravity = 20) {
        this.mesh = new THREE.Mesh(AssetCache.geos.particle, getBasicMaterial(color));
        this.mesh.position.copy(pos);
        this.mesh.scale.set(size, size, size);
        this.vel = new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10+5, (Math.random()-0.5)*10);
        this.life = life; this.gravity = gravity;
        state.scene.add(this.mesh);
    }
    update(dt) {
        this.vel.y -= this.gravity * dt; this.mesh.position.addScaledVector(this.vel, dt);
        this.mesh.rotation.x += dt*2; this.mesh.rotation.y += dt*2; this.life -= dt;
        const h = getHeight(this.mesh.position.x, this.mesh.position.z);
        if(this.mesh.position.y < h) { this.mesh.position.y = h; this.vel.y *= -0.5; this.vel.x *= 0.8; this.vel.z *= 0.8; }
        if(this.life <= 0) { state.scene.remove(this.mesh); return false; } return true;
    }
}

const CloudManager = {
    clouds: [],
    init: function() {
        for(let i=0; i<15; i++) {
            this.spawnCloud(true);
        }
    },
    spawnCloud: function(randomPos=false) {
        const group = new THREE.Group();
        const chunks = 6 + Math.floor(Math.random() * 6);
        const mat = new THREE.MeshStandardMaterial({color: 0xFFFFFF, transparent: true, opacity: 0.5, flatShading: false, roughness: 0.7, metalness: 0.1});

        // Main center puff
        const centerSize = 3.5 + Math.random() * 2;
        const centerMesh = new THREE.Mesh(AssetCache.geos.cloud, mat);
        centerMesh.scale.set(centerSize, centerSize * 0.8, centerSize);
        group.add(centerMesh);

        for(let j=0; j<chunks; j++) {
            const size = 1.5 + Math.random() * 2.5;
            const mesh = new THREE.Mesh(AssetCache.geos.cloud, mat);
            mesh.scale.set(size, size * 0.8, size);

            // Cluster around center
            const angle = Math.random() * Math.PI * 2;
            const dist = (centerSize * 0.5) + Math.random() * 3.0;
            const yOff = (Math.random() - 0.5) * 1.5;

            mesh.position.set(
                Math.cos(angle) * dist,
                yOff,
                Math.sin(angle) * dist
            );

            // Flatten bottom slightly by shifting lower puffs up or scaling
            // Actually just random rotation helps realism
            mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);

            group.add(mesh);
        }

        let x, z;
        if(randomPos) {
            x = (Math.random() - 0.5) * 400;
            z = (Math.random() - 0.5) * 400;
        } else {
            x = -200 - Math.random() * 50; // Start far left
            z = (Math.random() - 0.5) * 400;
        }
        const y = 30 + Math.random() * 15;

        group.position.set(x, y, z);
        group.scale.setScalar(1.5 + Math.random());

        state.scene.add(group);
        this.clouds.push({ mesh: group, speed: 1 + Math.random() * 2 });
    },
    update: function(dt) {
        for(let i = this.clouds.length - 1; i >= 0; i--) {
            const c = this.clouds[i];
            c.mesh.position.x += c.speed * dt;
            if(c.mesh.position.x > 250) {
                 state.scene.remove(c.mesh);
                 this.clouds.splice(i, 1);
                 this.spawnCloud();
            }
        }
    }
};

class VisualEffect {
    constructor(mesh, life, updateFn) {
        this.mesh = mesh;
        this.life = life;
        this.maxLife = life;
        this.updateFn = updateFn;
        state.scene.add(this.mesh);
    }
    update(dt) {
        this.life -= dt;
        if(this.updateFn) this.updateFn(this, dt);
        if(this.life <= 0) {
            state.scene.remove(this.mesh);
            if (this.mesh.geometry) this.mesh.geometry.dispose();
            if (this.mesh.material) {
                if(Array.isArray(this.mesh.material)) this.mesh.material.forEach(m=>m.dispose());
                else this.mesh.material.dispose();
            }
            if (this.mesh.children) {
                this.mesh.children.forEach(c => {
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                    if (c.isLight) c.dispose();
                });
            }
            return false;
        }
        return true;
    }
}

function spawnExplosion(x, y, z, color, count) {
    count = Math.max(1, Math.floor(count / 2));
    const pos = new THREE.Vector3(x, y, z);
    // Dynamic particles
    for(let i=0; i<count; i++) {
        const p = new Particle(pos.clone(), color, 0.1+Math.random()*0.2, 1.0+Math.random()*0.5);
        p.vel.set((Math.random()-0.5)*15, Math.random()*15+5, (Math.random()-0.5)*15);
        state.particles.push(p);
    }

    // Expanding core sphere
    const coreGeo = new THREE.SphereGeometry(0.5, 16, 16);
    const coreMat = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 0.8});
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    coreMesh.position.copy(pos);

    // Light
    const light = new THREE.PointLight(color, 2, 10);
    coreMesh.add(light);

    state.particles.push(new VisualEffect(coreMesh, 0.5, (eff, dt) => {
        const progress = 1.0 - (eff.life / eff.maxLife);
        eff.mesh.scale.setScalar(1.0 + progress * 4.0);
        eff.mesh.material.opacity = 0.8 * (eff.life / eff.maxLife);
        light.intensity = 2 * (eff.life / eff.maxLife);
    }));
}

function spawnPulse(x, y, z, color) {
    const geo = new THREE.RingGeometry(0.1, 0.5, 32);
    const mat = new THREE.MeshBasicMaterial({color: color, transparent: true, opacity: 1.0, side: THREE.DoubleSide, depthWrite: false});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.rotation.x = -Math.PI/2;
    mesh.position.set(x, y + 0.1, z); // Slightly above ground

    state.particles.push(new VisualEffect(mesh, 0.6, (eff, dt) => {
        const progress = 1.0 - (eff.life / eff.maxLife);
        eff.mesh.scale.setScalar(1.0 + progress * 10.0);
        eff.mesh.material.opacity = eff.life / eff.maxLife;
    }));
}

function spawnHealing(x, y, z) {
    const group = new THREE.Group();
    group.position.set(x, y, z);

    // Cross shape
    const mat = new THREE.MeshBasicMaterial({color: 0x00FF00, transparent: true, opacity: 0.8});
    const vGeo = new THREE.BoxGeometry(0.1, 0.6, 0.1);
    const hGeo = new THREE.BoxGeometry(0.6, 0.1, 0.1);
    const vMesh = new THREE.Mesh(vGeo, mat);
    const hMesh = new THREE.Mesh(hGeo, mat);
    group.add(vMesh); group.add(hMesh);

    // Light
    const light = new THREE.PointLight(0x00FF00, 1, 5);
    group.add(light);

    state.particles.push(new VisualEffect(group, 1.5, (eff, dt) => {
        eff.mesh.position.y += 2.0 * dt;
        eff.mesh.rotation.y += 3.0 * dt;
        const opacity = eff.life / eff.maxLife;
        vMesh.material.opacity = opacity;
        hMesh.material.opacity = opacity;
        light.intensity = opacity;
    }));
}

function spawnDust(x, y, z, color, radius) {
    const numDust = Math.floor(radius * 2.5);
    for(let i=0; i<numDust; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * radius;
        const dx = Math.cos(angle) * dist;
        const dz = Math.sin(angle) * dist;
        const p = new Particle(new THREE.Vector3(x + dx, y, z + dz), color, 0.2 + Math.random() * 0.4, 1.0 + Math.random());
        p.vel.set((Math.random()-0.5)*5, Math.random()*10, (Math.random()-0.5)*5);
        p.gravity = 5;
        state.particles.push(p);
    }
}


// --- js/terrain.js ---

let chunkTerrainMat, chunkWaterGeo, chunkWaterMat;

// Shared objects for performance
const _cWater = new THREE.Color(COLORS.water);
const _cSand = new THREE.Color(COLORS.sand);
const _cGrass = new THREE.Color(COLORS.grass);
const _cRock = new THREE.Color(COLORS.rock);
const _cSnow = new THREE.Color(COLORS.snow);
const _cLava = new THREE.Color(COLORS.lava);
const _col = new THREE.Color();

function initTerrainResources() {
    chunkTerrainMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: false });
    chunkWaterGeo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_RES/2, CHUNK_RES/2);

    const waterVertexShader = `
        uniform float time;
        varying vec2 vUv;
        void main() {
            vUv = uv;
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vec3 pos = position;

            float height = 0.0;
            // Primary wave
            height += sin(worldPosition.x * 0.5 + time) * 0.15;
            height += sin(worldPosition.z * 0.4 + time) * 0.15;

            // Secondary detail wave
            height += sin(worldPosition.x * 1.5 + time * 1.5) * 0.05;
            height += sin(worldPosition.z * 1.2 + time * 1.3) * 0.05;

            pos.z += height;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    `;
    const waterFragmentShader = `
        uniform vec3 color;
        varying vec2 vUv;
        void main() {
            gl_FragColor = vec4(color, 0.6);
        }
    `;
    chunkWaterMat = new THREE.ShaderMaterial({
        uniforms: {
            time: { value: 0 },
            color: { value: new THREE.Color(COLORS.water) }
        },
        vertexShader: waterVertexShader,
        fragmentShader: waterFragmentShader,
        transparent: true,
        side: THREE.DoubleSide
    });

    // Assign to state to update time in loop
    state.chunkWaterMat = chunkWaterMat;
}

function burnTreesAt(x, z, radius) {
    Object.values(state.chunks).forEach(chunk => {
        if(chunk.userData && chunk.userData.trees) {
            chunk.userData.trees.forEach(tree => {
                if(tree.burned) return;
                const dist = Math.sqrt((tree.mesh.position.x - x)**2 + (tree.mesh.position.z - z)**2);
                if(dist < radius) {
                    tree.burned = true;
                    // Charred visual
                    const t = tree.mesh.children[0]; // Trunk
                    const l = tree.mesh.children[1]; // Leaves
                    t.material = t.material.clone();
                    t.material.color.setHex(0x111111); // Black trunk

                    l.material = l.material.clone();
                    l.material.color.setHex(0x222222); // Charred leaves
                    l.scale.set(0.8, 0.5, 0.8); // Shriveled

                    // Smoke
                    for(let i=0; i<1; i++) {
                        const p = new Particle(tree.mesh.position.clone().add(new THREE.Vector3(0, 2, 0)), 0x333333, 0.2, 2.0, -1);
                        state.particles.push(p);
                    }
                }
            });
        }
    });
}

function modifyTerrain(centerX, centerZ, radius, amount) {
    const rSq = radius * radius;
    const modifiedChunks = new Set();
    for(let x = Math.floor(centerX - radius); x <= Math.ceil(centerX + radius); x++) {
        for(let z = Math.floor(centerZ - radius); z <= Math.ceil(centerZ + radius); z++) {
            const distSq = (x - centerX)**2 + (z - centerZ)**2;
            if (distSq <= rSq) {
                const falloff = 1 - (distSq / rSq);
                const key = `${x},${z}`;
                const currentMod = state.terrainMods.get(key) || 0;
                state.terrainMods.set(key, currentMod + (amount * falloff));
                const cx = Math.round(x / CHUNK_SIZE);
                const cz = Math.round(z / CHUNK_SIZE);
                modifiedChunks.add(`${cx},${cz}`);
            }
        }
    }

    // Check if buildings collapse
    state.buildings.forEach(b => {
        const groundH = getHeight(b.mesh.position.x, b.mesh.position.z);
        if(Math.abs(groundH - b.mesh.position.y) > 1.0) {
            b.takeDamage(100, true); // Collapse damage
        }
    });
    return modifiedChunks;
}

let lastChunkX = null;
let lastChunkZ = null;
let chunksLoadingPending = false;

function updateChunks(force = false, specificChunks = null) {
    if (!chunkTerrainMat) initTerrainResources();

    const cx = Math.round(state.cameraLookAt.x / CHUNK_SIZE);
    const cz = Math.round(state.cameraLookAt.z / CHUNK_SIZE);

    if (!force && !specificChunks && cx === lastChunkX && cz === lastChunkZ && !chunksLoadingPending) return;
    lastChunkX = cx;
    lastChunkZ = cz;
    chunksLoadingPending = false;

    const activeKeys = new Set();
    let createdCount = 0;
    const MAX_CHUNKS_PER_FRAME = 10;

    for(let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
        for(let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
            const key = (cx+x) + "," + (cz+z);
            activeKeys.add(key);
            if(!state.chunks[key] || (force && (!specificChunks || specificChunks.has(key)))) {

                if(state.chunks[key] && force) {
                    // Reuse existing chunk geometry
                    if(state.chunks[key].children[0]) {
                        updateChunkGeometry(state.chunks[key].children[0], cx+x, cz+z);
                    }
                    updateChunkDecorations(state.chunks[key], cx+x, cz+z);
                } else {
                    if (!state.chunks[key] && createdCount >= MAX_CHUNKS_PER_FRAME) {
                        chunksLoadingPending = true;
                        continue;
                    }

                    if(state.chunks[key]) {
                        state.scene.remove(state.chunks[key]);
                        // Only dispose terrain geometry (child 0), water (child 1) is shared
                        if(state.chunks[key].children[0] && state.chunks[key].children[0].geometry) state.chunks[key].children[0].geometry.dispose();
                    }
                    state.chunks[key] = createChunk(cx+x, cz+z);
                    state.scene.add(state.chunks[key]);
                    createdCount++;
                }
            }
        }
    }
    if(!force) {
        for(let key in state.chunks) {
            if(!activeKeys.has(key)) {
                state.scene.remove(state.chunks[key]);
                // Only dispose terrain geometry
                if(state.chunks[key].children[0] && state.chunks[key].children[0].geometry) state.chunks[key].children[0].geometry.dispose();
                delete state.chunks[key];
            }
        }
    }
}

function updateChunkGeometry(mesh, cx, cz) {
    const geo = mesh.geometry;
    const pos = geo.attributes.position;
    const colAttr = geo.attributes.color;

    const offX = cx * CHUNK_SIZE;
    const offZ = cz * CHUNK_SIZE;

    // Use shared color objects
    const cWater = _cWater;
    const cSand = _cSand;
    const cGrass = _cGrass;
    const cRock = _cRock;
    const cSnow = _cSnow;
    const cLava = _cLava;
    const col = _col;

    for(let i=0; i<pos.count; i++) {
         const wx = pos.getX(i) + offX;
         const wz = pos.getZ(i) + offZ;
         let h = getHeight(wx, wz);
         pos.setY(i, h);

         if (h < WATER_LEVEL) col.copy(cSand);
         else if (h < WATER_LEVEL + 1.0) col.copy(cSand).lerp(cGrass, h - WATER_LEVEL);
         else if (h < 8.0) col.copy(cGrass);
         else if (h < 9.0) col.copy(cGrass).lerp(cRock, h - 8.0);
         else if (h < 13.0) col.copy(cRock);
         else if (h < 15.0) col.copy(cRock).lerp(cSnow, (h - 13.0) / 2.0);
         else if (h < 19.0) col.copy(cSnow);
         else if (h < 21.0) col.copy(cSnow).lerp(cLava, (h - 19.0) / 2.0);
         else col.copy(cLava);

         if(h > 2.5) col.offsetHSL(0, 0, (Math.random()-0.5)*0.03);

         colAttr.setXYZ(i, col.r, col.g, col.b);
    }

    pos.needsUpdate = true;
    colAttr.needsUpdate = true;
    geo.computeVertexNormals();
}

function updateChunkDecorations(chunk, cx, cz) {
    if (!chunk.userData) return;

    if (chunk.userData.trees) {
        const trees = chunk.userData.trees;
        for (let i = trees.length - 1; i >= 0; i--) {
            const treeData = trees[i];
            const tMesh = treeData.mesh;
            const h = getHeight(tMesh.position.x, tMesh.position.z);
            tMesh.position.y = h;

            // Hide if underwater
            tMesh.visible = (h >= WATER_LEVEL);
        }
    }

    if (chunk.userData.flowers) {
        const flowers = chunk.userData.flowers;
        // Check if it's using the optimized structure or old array
        if (flowers.data && flowers.stems && flowers.petals) {
            const dataList = flowers.data;
            const stems = flowers.stems;
            const petals = flowers.petals;

            const dummy = new THREE.Object3D();
            const stemDummy = new THREE.Object3D();
            const petalDummy = new THREE.Object3D();
            const stemMatrix = new THREE.Matrix4();
            const petalMatrix = new THREE.Matrix4();

            const basePosArray = stems.geometry.attributes.aBasePos.array;

            for (let i = 0; i < dataList.length; i++) {
                const data = dataList[i];
                const h = getHeight(data.x, data.z);

                // Hide if out of bounds by scaling to 0
                const visible = (h > WATER_LEVEL + 0.5 && h < 7.0);
                const globalScale = visible ? 1 : 0;

                basePosArray[i*3] = data.x;
                basePosArray[i*3+1] = h;
                basePosArray[i*3+2] = data.z;

                dummy.position.set(data.x, h, data.z);
                dummy.rotation.set(data.rotX, data.rotY, data.rotZ);
                dummy.scale.set(globalScale, globalScale, globalScale);
                dummy.updateMatrix();

                // Set stem matrix
                stemDummy.position.set(0, 0.2 * data.scaleFactor, 0);
                stemDummy.rotation.set(0, 0, 0);
                stemDummy.scale.set(1.0, data.scaleFactor, 1.0);
                stemDummy.updateMatrix();
                stemMatrix.multiplyMatrices(dummy.matrix, stemDummy.matrix);
                stems.setMatrixAt(i, stemMatrix);

                // Set petal matrix
                petalDummy.position.set(0, 0.4 * data.scaleFactor, 0);
                petalDummy.rotation.set(0, 0, 0);
                petalDummy.scale.set(data.scaleFactor, data.scaleFactor * data.squashY, data.scaleFactor);
                petalDummy.updateMatrix();
                petalMatrix.multiplyMatrices(dummy.matrix, petalDummy.matrix);
                petals.setMatrixAt(i, petalMatrix);
            }
            stems.instanceMatrix.needsUpdate = true;
            petals.instanceMatrix.needsUpdate = true;
            stems.geometry.attributes.aBasePos.needsUpdate = true;
            petals.geometry.attributes.aBasePos.needsUpdate = true;
        } else if (Array.isArray(flowers)) {
            // Fallback for old save games / structure (if any remain)
            for (let i = flowers.length - 1; i >= 0; i--) {
                const flowerData = flowers[i];
                const fMesh = flowerData.mesh;
                const h = getHeight(fMesh.position.x, fMesh.position.z);
                fMesh.position.y = h;

                // Hide if underwater or too high up (not grassy)
                fMesh.visible = (h > WATER_LEVEL + 0.5 && h < 7.0);
            }
        }
    }
}

function createChunk(cx, cz) {
    const grp = new THREE.Group();
    const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, CHUNK_RES, CHUNK_RES);
    geo.rotateX(-Math.PI/2);

    // Init colors buffer
    const count = geo.attributes.position.count;
    const colors = new Float32Array(count * 3);
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const offX = cx * CHUNK_SIZE; const offZ = cz * CHUNK_SIZE;
    const mesh = new THREE.Mesh(geo, chunkTerrainMat);
    mesh.position.set(offX, 0, offZ); mesh.receiveShadow = true;
    grp.add(mesh);

    // Fill data
    updateChunkGeometry(mesh, cx, cz);

    const wMesh = new THREE.Mesh(chunkWaterGeo, chunkWaterMat);
    wMesh.rotation.x = -Math.PI/2; wMesh.position.set(offX, VISUAL_WATER_LEVEL, offZ);
    grp.add(wMesh);

    grp.userData = { trees: [], flowers: [] };
    for(let k=0; k<3; k++) {
        if(Math.random() > 0.5) {
             const lx = (Math.random()-0.5)*CHUNK_SIZE; const lz = (Math.random()-0.5)*CHUNK_SIZE;
             const h = getHeight(lx+offX, lz+offZ);
             if(h > 3 && h < 8) {
                const treeGroup = new THREE.Group();
                treeGroup.position.set(lx+offX, h, lz+offZ);

                const t = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.25,1,5), new THREE.MeshStandardMaterial({color: 0x8B4513, roughness: 0.7, metalness: 0.1}));
                t.position.y = 0.5; t.castShadow = true;

                const l = new THREE.Mesh(new THREE.ConeGeometry(0.9,2.8,5), new THREE.MeshStandardMaterial({color: 0x006400, roughness: 0.7, metalness: 0.1}));
                l.position.y = 1.9; l.castShadow = true;

                treeGroup.add(t); treeGroup.add(l);
                grp.add(treeGroup);

                grp.userData.trees.push({
                    mesh: treeGroup,
                    burned: false
                });
             }
        }
    }

    // Generate large coherent flower fields
    const spacing = 0.6;
    const flowerDataList = [];
    for(let x = -CHUNK_SIZE/2; x < CHUNK_SIZE/2; x += spacing) {
        for(let z = -CHUNK_SIZE/2; z < CHUNK_SIZE/2; z += spacing) {
            // Use simplex noise to determine if this spot is part of a flower field
            const worldX = x + offX;
            const worldZ = z + offZ;

            // Generate field mask (low frequency for large fields)
            const fieldNoise = state.simplex.noise2D(worldX * 0.03, worldZ * 0.03);

            // ~20% coverage -> threshold around 0.3 for noise ranging [-1, 1] roughly
            // Noise > 0.4 produces ~20% coverage area in typical simplex implementations
            if(fieldNoise > 0.4) {
                // Skip occasionally for less uniform density
                if(Math.random() > 0.8) continue;

                // Add some jitter to grid so they don't look perfectly aligned
                const jx = worldX + (Math.random()-0.5) * spacing * 0.8;
                const jz = worldZ + (Math.random()-0.5) * spacing * 0.8;

                const h = getHeight(jx, jz);

                // Only on grassy plains/hills
                if(h > WATER_LEVEL + 0.5 && h < 7.0) {
                    // Use another noise layer to determine color patches (coherent colors)
                    const colorNoise = state.simplex.noise2D(jx * 0.05 + 100, jz * 0.05 + 100);
                    // Map noise [-1, 1] to array index
                    const normalizedColor = (colorNoise + 1.0) / 2.0; // 0 to 1
                    let cIndex = Math.floor(normalizedColor * FlowerMaterials.length);
                    cIndex = Math.max(0, Math.min(FlowerMaterials.length - 1, cIndex));

                    const scaleFactor = 0.6 + Math.random() * 0.8; // 0.6x to 1.4x scale
                    const squashY = 0.6 + Math.random() * 0.6;

                    flowerDataList.push({
                        x: jx, z: jz, h: h,
                        scaleFactor: scaleFactor,
                        squashY: squashY,
                        cIndex: cIndex,
                        rotY: Math.random() * Math.PI * 2,
                        rotZ: (Math.random() - 0.5) * 0.4,
                        rotX: (Math.random() - 0.5) * 0.4
                    });
                }
            }
        }
    }

    if (flowerDataList.length > 0) {
        const dummy = new THREE.Object3D();

        const stemGeo = AssetCache.geos.flowerStem.clone();
        const petalGeo = AssetCache.geos.flowerPetal.clone();

        const stemInstancedMesh = new THREE.InstancedMesh(stemGeo, AssetCache.mats.flowerStem, flowerDataList.length);
        stemInstancedMesh.castShadow = true;

        const petalInstancedMesh = new THREE.InstancedMesh(petalGeo, AssetCache.mats.flowerPetalBase, flowerDataList.length);
        petalInstancedMesh.castShadow = true;

        const tempColor = new THREE.Color();

        const stemDummy = new THREE.Object3D();
        const petalDummy = new THREE.Object3D();
        const stemMatrix = new THREE.Matrix4();
        const petalMatrix = new THREE.Matrix4();

        const basePosArray = new Float32Array(flowerDataList.length * 3);

        for (let i = 0; i < flowerDataList.length; i++) {
            const data = flowerDataList[i];

            basePosArray[i*3] = data.x;
            basePosArray[i*3+1] = data.h;
            basePosArray[i*3+2] = data.z;

            // Replicate the flowerGroup transform
            dummy.position.set(data.x, data.h, data.z);
            dummy.rotation.set(data.rotX, data.rotY, data.rotZ);
            dummy.scale.set(1, 1, 1);
            dummy.updateMatrix();

            // Set stem matrix
            stemDummy.position.set(0, 0.2 * data.scaleFactor, 0);
            stemDummy.rotation.set(0, 0, 0);
            stemDummy.scale.set(1.0, data.scaleFactor, 1.0);
            stemDummy.updateMatrix();
            // stemWorldMatrix = flowerGroupMatrix * stemLocalMatrix
            stemMatrix.multiplyMatrices(dummy.matrix, stemDummy.matrix);
            stemInstancedMesh.setMatrixAt(i, stemMatrix);

            // Set petal matrix
            petalDummy.position.set(0, 0.4 * data.scaleFactor, 0);
            petalDummy.rotation.set(0, 0, 0);
            petalDummy.scale.set(data.scaleFactor, data.scaleFactor * data.squashY, data.scaleFactor);
            petalDummy.updateMatrix();
            petalMatrix.multiplyMatrices(dummy.matrix, petalDummy.matrix);
            petalInstancedMesh.setMatrixAt(i, petalMatrix);

            // Set petal color
            const petalColor = FlowerMaterials[data.cIndex].color;
            tempColor.copy(petalColor);
            petalInstancedMesh.setColorAt(i, tempColor);
        }

        stemInstancedMesh.geometry.setAttribute('aBasePos', new THREE.InstancedBufferAttribute(basePosArray, 3));
        petalInstancedMesh.geometry.setAttribute('aBasePos', new THREE.InstancedBufferAttribute(basePosArray, 3));

        grp.add(stemInstancedMesh);
        grp.add(petalInstancedMesh);
        grp.userData.flowers = {
            data: flowerDataList,
            stems: stemInstancedMesh,
            petals: petalInstancedMesh
        };
    }

    return grp;
}


// --- js/pathfinder.js ---

class BinaryHeap {
    constructor(scoreFunction) { this.content = []; this.scoreFunction = scoreFunction; }
    push(element) { this.content.push(element); this.siftUp(this.content.length - 1); }
    pop() {
        const result = this.content[0]; const end = this.content.pop();
        if (this.content.length > 0) { this.content[0] = end; this.siftDown(0); }
        return result;
    }
    size() { return this.content.length; }
    clear() { this.content.length = 0; }
    siftUp(n) {
        const element = this.content[n];
        while (n > 0) {
            const parentN = Math.floor((n + 1) / 2) - 1;
            const parent = this.content[parentN];
            if (this.scoreFunction(element) < this.scoreFunction(parent)) {
                this.content[parentN] = element; this.content[n] = parent; n = parentN;
            } else break;
        }
    }
    siftDown(n) {
        const length = this.content.length; const element = this.content[n];
        while (true) {
            const child2N = (n + 1) * 2; const child1N = child2N - 1;
            let swap = null;
            if (child1N < length) {
                const child1 = this.content[child1N];
                if (this.scoreFunction(child1) < this.scoreFunction(element)) swap = child1N;
            }
            if (child2N < length) {
                const child2 = this.content[child2N];
                if (this.scoreFunction(child2) < (swap === null ? this.scoreFunction(element) : this.scoreFunction(this.content[child1N]))) swap = child2N;
            }
            if (swap !== null) { this.content[n] = this.content[swap]; this.content[swap] = element; n = swap; } else break;
        }
    }
}

const PF_NEIGHBORS = [
    {x:0,y:1}, {x:1,y:0}, {x:0,y:-1}, {x:-1,y:0},
    {x:1,y:1}, {x:1,y:-1}, {x:-1,y:1}, {x:-1,y:-1}
];

const Pathfinder = {
    GRID_SIZE: 2.0,
    openHeap: new BinaryHeap(node => node.f),
    openSet: new Map(),
    closedSet: new Set(),
    findPath: function(startPos, endPos, isFlying = false, unitHeight = 1.5) {
        const startNode = { x: Math.round(startPos.x / this.GRID_SIZE), y: Math.round(startPos.z / this.GRID_SIZE) };
        const endNode = { x: Math.round(endPos.x / this.GRID_SIZE), y: Math.round(endPos.z / this.GRID_SIZE) };

        if(startNode.x === endNode.x && startNode.y === endNode.y) return [];

        this.openHeap.clear();
        this.openSet.clear();
        this.closedSet.clear();

        const openHeap = this.openHeap;
        const openSet = this.openSet;
        const closedSet = this.closedSet;

        const getKey = (x, y) => (x & 0xFFFF) << 16 | (y & 0xFFFF);

        // Precompute start height
        startNode.h = getHeight(startNode.x * this.GRID_SIZE, startNode.y * this.GRID_SIZE);

        startNode.g = 0; startNode.f = 0;
        openHeap.push(startNode);
        openSet.set(getKey(startNode.x, startNode.y), startNode);

        let iterations = 0;
        const MAX_ITER = 10000;
        const safeH = WATER_LEVEL - 2.2; // All units use Shaman height for water

        while(openHeap.size() > 0) {
            iterations++;
            if(iterations > MAX_ITER) break;

            const currentNode = openHeap.pop();
            const key = getKey(currentNode.x, currentNode.y);

            // Check if already closed (handling duplicate nodes in heap)
            if (closedSet.has(key)) continue;

            openSet.delete(key);
            closedSet.add(key);

            if(currentNode.x === endNode.x && currentNode.y === endNode.y) {
                const path = [];
                let curr = currentNode;
                while(curr.parent) {
                    path.push(new THREE.Vector3(curr.x * this.GRID_SIZE, 0, curr.y * this.GRID_SIZE));
                    curr = curr.parent;
                }
                return path.reverse();
            }

            for(let offset of PF_NEIGHBORS) {
                const nx = currentNode.x + offset.x;
                const ny = currentNode.y + offset.y;
                const nKey = getKey(nx, ny);

                if(closedSet.has(nKey)) continue;

                let neighbor = openSet.get(nKey);
                let h;

                // Optimization: Use cached height if available
                if (neighbor) {
                    h = neighbor.h;
                } else {
                    const wx = nx * this.GRID_SIZE;
                    const wz = ny * this.GRID_SIZE;
                    h = getHeight(wx, wz);

                    if(!isFlying && h < safeH) continue; // Too Deep

                    // Allow entry if close to target (within 3 units / ~1.5 grid cells) to handle large buildings
                    const distToTarget = Math.sqrt((nx - endNode.x)**2 + (ny - endNode.y)**2);
                    if(!isFlying && distToTarget > 1.5 && isBlocked(wx, wz)) continue; // Building collision
                }

                // Diagonal corner cutting check
                if (Math.abs(offset.x) === 1 && Math.abs(offset.y) === 1) {
                    if (!isFlying) {
                        const h1 = getHeight((currentNode.x + offset.x) * this.GRID_SIZE, currentNode.y * this.GRID_SIZE);
                        const h2 = getHeight(currentNode.x * this.GRID_SIZE, (currentNode.y + offset.y) * this.GRID_SIZE);
                        if (h1 < safeH || h2 < safeH) continue;
                    }
                }

                const dist = Math.sqrt(offset.x*offset.x + offset.y*offset.y);
                const currentH = currentNode.h; // Optimization: Use cached height
                const dh = Math.abs(h - currentH);
                if(!isFlying && dh > 2.0) continue;

                let cost = dist + dh * 0.5;
                if (h < WATER_LEVEL) cost += 10.0; // Penalty for water
                const gScore = currentNode.g + cost;

                if(!neighbor || gScore < neighbor.g) {
                    const newNode = { x: nx, y: ny, parent: currentNode, g: gScore, f: 0, h: h }; // Cache h
                    const hScore = Math.sqrt((nx - endNode.x)**2 + (ny - endNode.y)**2);
                    newNode.f = newNode.g + hScore;
                    openHeap.push(newNode);
                    openSet.set(nKey, newNode);
                }
            }
        }
        return null;
    }
};

function isWalkableLine(start, end, isFlying, unitHeight = 1.5) {
    const dist = start.distanceTo(end);
    const steps = Math.ceil(dist / 1.0);
    if (steps <= 1) return true;

    const dir = end.clone().sub(start).normalize();
    const checkPos = start.clone();
    const safeH = WATER_LEVEL - 2.2; // All units use Shaman height for water

    for(let i=1; i<steps; i++) {
        checkPos.add(dir);
        const h = getHeight(checkPos.x, checkPos.z);
        if(!isFlying) {
            if(h < safeH) return false;
            if(isBlocked(checkPos.x, checkPos.z)) return false;
        }
    }
    return true;
}

function smoothPath(path, isFlying, unitHeight) {
    if(path.length < 3) return path;
    const newPath = [path[0]];
    let current = path[0];

    for(let i=1; i<path.length-1; i++) {
        // Check if we can go from current to path[i+1] directly
        if(isWalkableLine(current, path[i+1], isFlying, unitHeight)) {
            // Can skip path[i]
            continue;
        } else {
            // Cannot skip, add path[i]
            newPath.push(path[i]);
            current = path[i];
        }
    }
    newPath.push(path[path.length-1]);
    return newPath;
}

class Fireball {
    constructor(start, end, faction) {
        this.mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({color: 0xFF4500}));
        this.mesh.position.copy(start); this.target = end; this.dir = end.clone().sub(start).normalize();
        this.faction = faction;
        this.speed = 25; this.active = true; this.trailTimer = 0;

        // Add light
        this.light = new THREE.PointLight(0xFF4500, 1.5, 15);
        this.mesh.add(this.light);

        state.scene.add(this.mesh);
    }
    update(dt) {
        if(!this.active) return false;
        const moveDist = this.speed * dt;
        const distToTarget = this.mesh.position.distanceTo(this.target);

        if (distToTarget <= moveDist) {
             this.mesh.position.copy(this.target); // Snap to target for visual
             this.explode();
             return false;
        }

        this.mesh.position.addScaledVector(this.dir, moveDist);

        // Terrain Collision Check
        const h = getHeight(this.mesh.position.x, this.mesh.position.z);
        if (h > this.mesh.position.y) {
             this.mesh.position.y = h; // Snap to surface
             this.explode();
             return false;
        }

        this.trailTimer += dt;
        if(this.trailTimer > 0.02) {
            // High quality trail
            const trailMat = new THREE.MeshBasicMaterial({color: 0xFF4500, transparent: true, opacity: 0.8});
            const trailMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), trailMat);
            trailMesh.position.copy(this.mesh.position);
            trailMesh.position.add(new THREE.Vector3((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2));

            state.particles.push(new VisualEffect(trailMesh, 0.4, (eff, dt) => {
                const prog = eff.life / eff.maxLife;
                eff.mesh.scale.setScalar(prog);
                eff.mesh.material.opacity = prog;
            }));
            this.trailTimer = 0;
        }
        return true;
    }
    explode() {
        state.scene.remove(this.mesh);
        this.mesh.geometry.dispose();
        this.mesh.material.dispose();
        this.light.dispose();
        this.active = false;
        spawnExplosion(this.mesh.position.x, this.mesh.position.y, this.mesh.position.z, 0xFF4500, 20);
        SoundManager.playSound('explosion');
        const impactPos = this.mesh.position;
        burnTreesAt(impactPos.x, impactPos.z, 8); // Burn trees
        // Units
        SpatialHash.query(impactPos.x, impactPos.z, 8).forEach(u => {
            const d = u.mesh.position.distanceTo(impactPos);
            if(d < 8) {
                if (u.faction !== this.faction) {
                    const forceDir = u.mesh.position.clone().sub(impactPos).normalize(); const force = (8 - d) * 3;
                    forceDir.multiplyScalar(force); forceDir.y += force * 0.5;
                    u.applyForce(forceDir); u.takeDamage(27);
                    u.burnTimer = 3.0;
                }
            }
        });
        // Buildings
        state.buildings.forEach(b => {
            const d = b.mesh.position.distanceTo(impactPos);
            if(d < 8 && b.faction !== this.faction) {
                b.takeDamage(75); // Fireball deals 75 damage to buildings
                b.burnTimer = 3.0;
            }
        });
    }
}

class Volcano extends ActiveEffect {
    constructor(x, z, faction) {
        super();
        this.x = x; this.z = z;
        this.faction = faction;
        this.timer = 15.0;
        this.interval = 0;
        SoundManager.playSound('explosion');

        // Add persistent light
        this.light = new THREE.PointLight(0xFF4500, 2, 20);
        this.light.position.set(x, getHeight(x, z) + 5, z);
        state.scene.add(this.light);

        // Initial rise
        const mods = modifyTerrain(x, z, 8, 5);
        updateChunks(true, mods);
    }
    update(dt) {
        this.timer -= dt;
        this.interval += dt;

        this.light.position.y = getHeight(this.x, this.z) + 2;
        this.light.intensity = 2 + Math.sin(this.timer * 10) * 0.5;

        // Visuals: Lava Particles
        if(Math.random() < 0.25) {
            const dist = Math.random() * 4;
            const angle = Math.random() * Math.PI * 2;
            const px = this.x + Math.cos(angle) * dist;
            const pz = this.z + Math.sin(angle) * dist;
            const h = getHeight(px, pz);
            const p = new Particle(new THREE.Vector3(px, h, pz), COLORS.lava, 0.3 + Math.random()*0.3, 1.5);
            p.vel.set((Math.random()-0.5)*4, Math.random()*8+4, (Math.random()-0.5)*4);
            state.particles.push(p);
        }

        // Visuals: Smoke Clouds
        if(Math.random() < 0.1) {
            const size = 1 + Math.random() * 2;
            const smokeMesh = new THREE.Mesh(AssetCache.geos.cloud, new THREE.MeshBasicMaterial({color: 0x222222, transparent: true, opacity: 0.8}));
            smokeMesh.position.set(this.x + (Math.random()-0.5)*2, getHeight(this.x, this.z), this.z + (Math.random()-0.5)*2);
            smokeMesh.scale.set(size, size, size);
            smokeMesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);

            state.particles.push(new VisualEffect(smokeMesh, 3.0, (eff, dt) => {
                eff.mesh.position.y += dt * 3.0;
                eff.mesh.position.x += (Math.random() - 0.5) * dt;
                eff.mesh.position.z += (Math.random() - 0.5) * dt;
                eff.mesh.rotation.y += dt;
                const prog = eff.life / eff.maxLife;
                eff.mesh.scale.setScalar(size * (1.0 + (1.0 - prog) * 2.0));
                eff.mesh.material.opacity = 0.8 * prog;
            }));
        }

        if(this.interval > 0.2) {
            this.interval = 0;
            // Continually raise/modify
            const mods = modifyTerrain(this.x, this.z, 5, 0.2);
            updateChunks(true, mods);

            burnTreesAt(this.x, this.z, 10);

            // Push & Damage
            SpatialHash.query(this.x, this.z, 10).forEach(u => {
                const dist = u.mesh.position.distanceTo(new THREE.Vector3(this.x, u.mesh.position.y, this.z));
                if(dist < 10 && u.faction !== this.faction) {
                    const dir = u.mesh.position.clone().sub(new THREE.Vector3(this.x, u.mesh.position.y, this.z)).normalize();
                    u.applyForce(dir.multiplyScalar(20).add(new THREE.Vector3(0, 10, 0)));
                    if (!u.isShaman) u.takeDamage(5);
                }
            });
            state.buildings.forEach(b => {
                 const dist = b.mesh.position.distanceTo(new THREE.Vector3(this.x, b.mesh.position.y, this.z));
                 if(dist < 10 && b.faction !== this.faction) b.takeDamage(10);
            });
        }
        if(this.timer <= 0) {
            state.scene.remove(this.light);
            this.light.dispose();
            return false;
        }
        return true;
    }
}

class Swamp extends ActiveEffect {
    constructor(x, z, faction) {
        super();
        this.pos = new THREE.Vector3(x, getHeight(x,z)+0.1, z);
        this.faction = faction;
        this.timer = 30.0;
