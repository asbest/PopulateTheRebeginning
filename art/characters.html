<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neue Stammesfiguren · Populate</title>
<style>body{margin:0;background:#13272c;color:#eddfbd;font:16px system-ui}canvas{display:block;width:100%;height:100vh}header{position:absolute;top:28px;left:40px;pointer-events:none}h1{font-size:24px;margin:0 0 8px}p{color:#9bb9bb;margin:0}footer{position:absolute;bottom:32px;left:8%;right:8%;display:flex;justify-content:space-between;font-size:15px;pointer-events:none}a{position:absolute;right:40px;top:34px;color:#eddfbd}#loading{position:absolute;top:50%;left:45%}</style>
<header><h1>Die Stämme der neuen Welt</h1><p>Neue 3D-Figuren · gewebter Stoff, Leder und Bronze · Ziehen zum Drehen</p></header><a href="../">Zum Spiel →</a><div id="loading">Texturen laden …</div><footer><span>Wilder</span><span>Krieger</span><span>Schamanin</span><span>Feuerkrieger</span><span>Spion</span></footer>
<script type="module">
import * as T from '../vendor/three.module.js';import {createCharacters} from './characters.js';import {createLocomotion} from './locomotion.js';
const locomotion=createLocomotion(T);let playing=!new URLSearchParams(location.search).has('static'),slope=0,previewSpeed=1.2,previous=performance.now();
const controls=document.createElement('div');controls.style.cssText='position:absolute;top:110px;left:40px;display:flex;gap:12px';controls.innerHTML='<button id="walk">Laufen / Pause</button><button id="pace">Gehen</button><button id="view">Seitenansicht</button><button id="slope">Gelände: flach</button>';document.body.append(controls);
controls.querySelectorAll('button').forEach(b=>b.style.cssText='background:#213b40;color:#eddfbd;border:1px solid #78928d;padding:10px 18px;border-radius:8px;cursor:pointer');
document.getElementById('pace').onclick=()=>{previewSpeed=previewSpeed===1.2?4.5:1.2;document.getElementById('pace').textContent=previewSpeed===1.2?'Gehen':'Rennen';};document.getElementById('view').onclick=()=>{units.forEach(u=>{u.mesh.rotation.y=u.mesh.rotation.y<1?Math.PI/2:0;u.gait=null;});};
document.getElementById('walk').onclick=()=>{playing=!playing;};document.getElementById('slope').onclick=()=>{slope=slope===0?.15:slope>0?-.15:0;document.getElementById('slope').textContent='Gelände: '+(slope===0?'flach':slope>0?'bergauf':'bergab');floor.rotation.x=-Math.PI/2-Math.atan(slope);};
const characters=createCharacters(T),scene=new T.Scene();scene.background=new T.Color(0x13272c);
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);camera.position.set(0,2.7,10.5);camera.lookAt(0,1.7,0);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xe4f3ee,0x30313b,1.25));const sun=new T.DirectionalLight(0xffe0ae,2.4);sun.position.set(-3,8,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-8,right:8,top:7,bottom:-7});sun.shadow.bias=-.0004;scene.add(sun);const rim=new T.DirectionalLight(0x63c8e0,1.8);rim.position.set(3,4,-3);scene.add(rim);
const floor=new T.Mesh(new T.PlaneGeometry(40,40),new T.MeshStandardMaterial({color:0x213a3c,roughness:1}));floor.material.color.convertSRGBToLinear();floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const units=['wild','warrior','shaman','firewarrior','spy'].map((type,i)=>{const u={mesh:new T.Group(),type};characters.build(u,0x377abc);u.mesh.position.x=(i-2)*1.38;u.mesh.rotation.y=-.16;scene.add(u.mesh);return u;});
await characters.ready;document.getElementById('loading').remove();window.characterGallery={units,characters,renderer,scene,camera,ready:true};
function labels(){document.querySelectorAll('footer span').forEach((el,i)=>{const v=units[i].mesh.position.clone().project(camera);el.style.position='fixed';el.style.left=((v.x*.5+.5)*100)+'%';el.style.transform='translateX(-50%)';el.style.bottom='36px';});}labels();addEventListener('resize',labels);
let dragging=false,last=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;last=e.clientX;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(dragging){units.forEach(u=>u.mesh.rotation.y+=(e.clientX-last)*.01);last=e.clientX;}});renderer.domElement.addEventListener('pointerup',()=>dragging=false);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});renderer.setAnimationLoop(()=>{
 const now=performance.now(),dt=Math.min((now-previous)/1000,.05);previous=now;
 for(const u of units){
  if(new URLSearchParams(location.search).has('static'))continue;
  u.virtual=u.virtual||new T.Vector3();u.virtual.x+=(playing?previewSpeed:0)*Math.sin(u.mesh.rotation.y)*dt;u.virtual.z+=(playing?previewSpeed:0)*Math.cos(u.mesh.rotation.y)*dt;
  const presentation=u.mesh.position.clone();u.mesh.position.add(u.virtual);u.moveSpeed=6;u.isShaman=u.type==='shaman';u.isGrounded=true;u.state=playing?'move':'idle';u.animTime=(u.animTime||0)+dt;
  locomotion.animate(u,dt,(x,z)=>slope*(z-u.virtual.z));u.mesh.position.copy(presentation);
 }
 renderer.render(scene,camera);
});
</script></html>
