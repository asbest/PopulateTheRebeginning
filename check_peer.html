<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
<script>
    console.log("Creating peer...");
    let p = new Peer("hello-123", { debug: 3 });
    p.on('open', id => console.log("OPEN:", id));
    p.on('error', err => console.log("ERROR:", err.type, err.message));
</script>
</body>
</html>
