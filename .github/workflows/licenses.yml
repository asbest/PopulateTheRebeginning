name: License compliance
on: [push, pull_request, workflow_dispatch]
jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check free-use licenses and asset provenance
        run: node tools/audit-licenses.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-audit
          path: test-results/license-audit.json
