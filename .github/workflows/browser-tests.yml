name: Browser playability
on: [push, pull_request, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run game server and gameplay tests
        run: |
          node tools/serve.mjs > /tmp/populate-server.log 2>&1 &
          node tests/browser.mjs
          node tests/blender-assets.mjs
          node tests/locomotion.mjs
          node tests/spells.mjs
          node tests/strategy.mjs
          node tests/materials.mjs
          node tests/strategy-long.mjs
          node tests/live-gameplay.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: test-results/
